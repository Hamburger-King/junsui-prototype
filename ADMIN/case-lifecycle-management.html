<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>案件生命周期管理</title>
  <style>
    :root{--primary:#165DFF;--primary-hover:#0E42D2;--primary-light:#E8F3FF;--text-1:#1D2129;--text-2:#4E5969;--text-3:#86909C;--line:#E5E6EB;--line-2:#F2F3F5;--bg:#F7F8FA;--success:#00B578;--warning:#FF7D00;--danger:#F53F3F;--purple:#722ED1;--shadow:0 4px 12px rgba(0,0,0,.04)}
    *{box-sizing:border-box}body{margin:0;font:14px "PingFangSC","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text-1)}button,input,select,textarea{font:inherit}.page{min-width:1480px;min-height:100vh;padding:12px}.page-shell,.panel,.table-area{display:flex;flex-direction:column}.page-shell{min-height:calc(100vh - 24px)}.panel{flex:1;min-height:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
    .panel-head{min-height:66px;padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:18px}.panel-title{font-size:18px;font-weight:700;line-height:1.4}.panel-sub{margin-top:4px;color:var(--text-3);font-size:12px}.head-actions,.toolbar-actions,.table-action{display:flex;align-items:center;gap:10px}.case-tabs{height:44px;padding:0 16px;display:flex;align-items:flex-end;gap:24px;border-top:1px solid var(--line-2);border-bottom:1px solid var(--line-2)}.case-tab{height:44px;display:inline-flex;align-items:center;color:var(--text-2);font-size:13px;border:0;border-bottom:2px solid transparent;background:transparent;cursor:pointer}.case-tab.active{color:var(--primary);border-color:var(--primary)}
    .handoff{display:none;margin:12px 16px 0;padding:10px 12px;border:1px solid #BBD7FF;border-radius:6px;background:#F4F9FF;align-items:center;justify-content:space-between;gap:16px;color:#1D4ED8}.handoff.show{display:flex}.metric-row{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border-bottom:1px solid var(--line-2)}.metric{min-height:70px;padding:12px 16px;border-right:1px solid var(--line-2)}.metric:last-child{border-right:0}.metric-label{color:var(--text-3);font-size:12px}.metric-value{margin-top:6px;font-size:24px;font-weight:700}.metric-note{margin-left:6px;font-size:12px;font-weight:400;color:var(--text-3)}
    .toolbar{padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line-2)}.filter-item{display:inline-flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px}.input,.select,.date-input,.jump-input,.textarea{height:32px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text-1);padding:0 10px;outline:none}.input:focus,.select:focus,.date-input:focus,.jump-input:focus,.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(22,93,255,.08)}.select{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,#9aa4b2 50%),linear-gradient(135deg,#9aa4b2 50%,transparent 50%);background-position:calc(100% - 14px) 13px,calc(100% - 9px) 13px;background-size:5px 5px;background-repeat:no-repeat}.keyword{width:260px}.select{width:126px}.date-input{width:142px}.toolbar-actions{margin-left:auto}
    .btn,.link-btn,.page-btn,.page-arrow{cursor:pointer;transition:all .18s ease}.btn{height:32px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn svg{width:15px;height:15px}.btn:hover{border-color:#c9cdd4;background:#f7f8fa}.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}.btn-danger{color:var(--danger);border-color:#ffd0cf;background:#fff6f5}.btn-ghost{background:#F2F3F5;border-color:#F2F3F5}
    .table-wrap{padding:12px 16px 2px;flex:1;min-height:0;overflow:auto}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}thead th{height:44px;padding:0 12px;text-align:left;font-weight:600;background:#F7F8FA;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}tbody td{height:54px;padding:8px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:#fff;color:var(--text-2);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}thead th:first-child,tbody td:first-child{border-left:1px solid var(--line)}.check-col{width:44px;text-align:center}.id-col{width:150px}.client-col{width:190px}.reason-col{width:142px}.stage-col{width:104px}.progress-col{width:126px}.node-col{width:200px}.time-col{width:150px}.owner-col{width:108px}.amount-col{width:106px}.op-col{width:250px}.row-check,#checkAll{width:14px;height:14px;accent-color:var(--primary);cursor:pointer}
    .main-text{color:var(--text-1);font-weight:500}.sub-text{margin-top:3px;color:var(--text-3);font-size:12px}.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:4px;font-size:12px}.tag-blue{background:#E8F3FF;color:#165DFF}.tag-green{background:#E8FFEA;color:#2BA471}.tag-orange{background:#FFF3E8;color:#FF7D00}.tag-red{background:#FFECE8;color:#F53F3F}.tag-gray{background:#F2F3F5;color:#4E5969}.tag-purple{background:#F3E8FF;color:#722ED1}.progress{display:flex;align-items:center;gap:8px}.progress-track{width:66px;height:6px;background:#E5E6EB;border-radius:999px;overflow:hidden}.progress-fill{display:block;height:100%;background:linear-gradient(90deg,#5CA8FF,#165DFF)}.link-btn{border:0;background:transparent;padding:0;color:var(--primary);font-size:13px}.link-btn.danger{color:var(--danger)}.link-btn.muted{color:var(--text-2)}.empty{padding:42px 16px;text-align:center;color:#B0B7C3}
    .footer{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 16px;color:var(--text-2);font-size:13px}.pagination,.pager,.jump{display:flex;align-items:center;gap:8px}.page-btn,.page-arrow,.jump-input{min-width:32px;height:32px;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center}.page-arrow{background:#F7F8FA}.page-arrow.disabled{opacity:.45;cursor:not-allowed}.page-btn.active{border-color:var(--primary);color:var(--primary)}.jump-input{width:46px;text-align:center}
    .mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.34);z-index:9000;align-items:center;justify-content:center}.mask.show{display:flex}.modal{width:820px;max-height:86vh;background:#fff;border-radius:8px;box-shadow:0 18px 48px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden}.modal.sm{width:560px}.modal.lg{width:980px}.modal-header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);font-weight:600}.modal-close{border:0;background:transparent;color:var(--text-3);font-size:20px;cursor:pointer}.modal-body{padding:18px;overflow:auto}.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}.form-item{display:flex;flex-direction:column;gap:8px}.form-item.full{grid-column:1 / 3}.form-item label{font-size:13px;color:var(--text-2)}.textarea{height:auto;min-height:78px;padding:10px;resize:vertical}.req{color:var(--danger);margin-left:2px}.source-switch{display:inline-flex;border:1px solid var(--line);border-radius:4px;overflow:hidden}.source-switch button{height:30px;padding:0 14px;border:0;background:#fff;color:var(--text-2);cursor:pointer}.source-switch button.active{background:var(--primary);color:#fff}
    .drawer{position:fixed;right:0;top:0;bottom:0;width:680px;background:#fff;box-shadow:-12px 0 32px rgba(0,0,0,.14);z-index:9100;transform:translateX(104%);transition:transform .24s ease;display:flex;flex-direction:column}.drawer.show{transform:translateX(0)}.drawer-header{height:58px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.drawer-title{font-size:16px;font-weight:700}.drawer-body{padding:18px;overflow:auto}.section{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}.section-head{height:40px;padding:0 14px;display:flex;align-items:center;background:#F7F8FA;font-weight:600}.section-body{padding:14px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}.kv{line-height:1.6}.kv-label{color:var(--text-3);font-size:12px}.kv-value{color:var(--text-1)}.steps{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.step{text-align:center;color:var(--text-3)}.dot{width:22px;height:22px;border-radius:50%;margin:0 auto 6px;background:#E5E6EB;color:#86909C;display:flex;align-items:center;justify-content:center;font-size:12px}.step.done .dot,.step.active .dot{background:var(--primary);color:#fff}.step.active{color:var(--primary);font-weight:600}.timeline{display:grid;gap:12px}.time-item{position:relative;padding-left:18px;color:var(--text-2);line-height:1.6}.time-item:before{content:"";position:absolute;left:0;top:7px;width:8px;height:8px;border-radius:50%;background:var(--primary)}.time-item:after{content:"";position:absolute;left:3px;top:19px;width:1px;height:calc(100% + 4px);background:var(--line)}.time-item:last-child:after{display:none}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);padding:9px 14px;border-radius:4px;background:#1D2129;color:#fff;z-index:9500;display:none}.toast.show{display:block}.hidden{display:none!important}
  </style>
</head>
<body>
  <div class="page"><div class="page-shell"><section class="panel">
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false">
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-transfer" viewBox="0 0 24 24"><path d="M5 7h12M13 3l4 4-4 4M19 17H7M11 13l-4 4 4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-flow" viewBox="0 0 24 24"><path d="M6 7h4v4H6zM14 13h4v4h-4zM10 9h2a2 2 0 0 1 2 2v4M12 15h2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </svg>
    <div class="panel-head">
      <div><div class="panel-title">案件生命周期管理</div><div class="panel-sub">统一管理案件从线索转案、新建建档、立案办理、审理执行到结案归档的全流程节点。</div></div>
      <div class="head-actions">
        <button class="btn" id="btnTemplate"><svg><use href="#i-flow"/></svg>流程模板</button>
        <button class="btn" id="btnLeadCase"><svg><use href="#i-transfer"/></svg>线索转案</button>
        <button class="btn btn-primary" id="btnAdd"><svg><use href="#i-plus"/></svg>新建案件</button>
      </div>
    </div>
    <div class="case-tabs" id="tabs"></div>
    <div class="handoff" id="handoffBanner"><span id="handoffText"></span><button class="btn btn-primary" id="btnOpenHandoff">查看转案草稿</button></div>
    <div class="metric-row" id="metrics"></div>
    <div class="toolbar">
      <div class="filter-item"><input class="input keyword" id="keyword" placeholder="搜索案件号、当事人、线索编号、案情关键词" /></div>
      <div class="filter-item"><label>来源：</label><select class="select" id="sourceFilter"></select></div>
      <div class="filter-item"><label>案由：</label><select class="select" id="reasonFilter"></select></div>
      <div class="filter-item"><label>地区：</label><select class="select" id="regionFilter"></select></div>
      <div class="filter-item"><label>阶段：</label><select class="select" id="stageFilter"></select></div>
      <div class="filter-item"><label>负责人：</label><select class="select" id="ownerFilter"></select></div>
      <div class="filter-item"><label>创建：</label><input class="date-input" type="date" id="startDate" /><span>至</span><input class="date-input" type="date" id="endDate" /></div>
      <div class="toolbar-actions"><button class="btn" id="btnReset">重置</button><button class="btn btn-primary" id="btnSearch">查询</button></div>
    </div>
    <div class="table-area"><div class="table-wrap"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div></div>
    <div class="footer"><div id="totalText">共 0 条</div><div class="pagination"><div class="pager" id="pager"></div><div class="jump">前往 <input class="jump-input" id="jumpInput" value="1" /> 页</div></div></div>
  </section></div></div>
  <aside class="drawer" id="drawer"><div class="drawer-header"><div><div class="drawer-title" id="drawerTitle">案件详情</div><div class="panel-sub" id="drawerSub"></div></div><button class="modal-close" data-close-drawer>×</button></div><div class="drawer-body" id="drawerBody"></div></aside>
  <div class="mask" id="caseMask"><div class="modal lg"><div class="modal-header"><span id="caseModalTitle">新建案件</span><button class="modal-close" data-close="caseMask">×</button></div><div class="modal-body" id="caseBody"></div><div class="modal-footer"><button class="btn" data-close="caseMask">取消</button><button class="btn btn-primary" id="btnSaveCase">保存案件</button></div></div></div>
  <div class="mask" id="advanceMask"><div class="modal"><div class="modal-header"><span>推进案件阶段</span><button class="modal-close" data-close="advanceMask">×</button></div><div class="modal-body" id="advanceBody"></div><div class="modal-footer"><button class="btn" data-close="advanceMask">取消</button><button class="btn btn-primary" id="btnSaveAdvance">确认推进</button></div></div></div>
  <div class="mask" id="simpleMask"><div class="modal"><div class="modal-header"><span id="simpleTitle">操作</span><button class="modal-close" data-close="simpleMask">×</button></div><div class="modal-body" id="simpleBody"></div><div class="modal-footer"><button class="btn" data-close="simpleMask">取消</button><button class="btn btn-primary" id="btnSaveSimple">保存</button></div></div></div>
  <div class="toast" id="toast"></div>
  <script>
    const stages=['待建档','已立案','证据整理','庭前准备','审理中','执行中','已结案'];
    const reasons=['婚姻家事','劳动争议','合同纠纷','房产纠纷','债权债务','侵权纠纷'];
    const regions=['上海','北京','广州','杭州','深圳','南京'];
    const owners=['沈律师','王律师','刘律师','周律师','许律师','运营专员'];
    const leadPool=[
      {id:'XS20260617001',name:'张敏',phone:'138****2718',reason:'婚姻家事',region:'上海',amount:'20-30万',summary:'离婚诉讼，关注财产分割与子女抚养。'},
      {id:'XS20260617002',name:'李伟',phone:'139****8831',reason:'劳动争议',region:'北京',amount:'8-12万',summary:'解除劳动合同，需测算赔偿金额。'},
      {id:'XS20260617004',name:'赵莹',phone:'137****5526',reason:'房产纠纷',region:'杭州',amount:'30-50万',summary:'二手房抵押未解除，拟发送律师函。'}
    ];
    const cases=[
      {id:'AJ20260617001',source:'线索转入',leadId:'XS20260617001',client:'张敏',phone:'138****2718',reason:'婚姻家事',region:'上海',stage:'待建档',node:'完善委托信息与冲突检索',deadline:'2026-06-18 18:00',owner:'沈律师',amount:'20-30万',createdAt:'2026-06-17',priority:'高',summary:'线索转案后待确认委托范围，需补充子女抚养诉求与财产清单。',materials:['结婚证.pdf','财产清单.xlsx'],fees:[['咨询费','已收','500']],tasks:['完成利益冲突检索','确认委托合同版本']},
      {id:'AJ20260615002',source:'直接新建',leadId:'-',client:'上海云杉贸易有限公司',phone:'021****7788',reason:'合同纠纷',region:'上海',stage:'证据整理',node:'整理供货合同与对账单',deadline:'2026-06-20 12:00',owner:'刘律师',amount:'50万以上',createdAt:'2026-06-15',priority:'中',summary:'客户追讨供货尾款，已完成立案材料初稿。',materials:['供货合同.pdf','对账单.xlsx','发票.zip'],fees:[['律师费首款','已收','12000']],tasks:['补齐发票原件','生成证据目录']},
      {id:'AJ20260612003',source:'线索转入',leadId:'XS20260617002',client:'李伟',phone:'139****8831',reason:'劳动争议',region:'北京',stage:'庭前准备',node:'准备仲裁庭审提纲',deadline:'2026-06-19 10:00',owner:'王律师',amount:'8-12万',createdAt:'2026-06-12',priority:'中',summary:'客户被解除劳动合同，工资流水已补齐。',materials:['劳动合同.pdf','工资流水.pdf'],fees:[['代理费','待收','8000']],tasks:['确认出庭时间','补充考勤记录']},
      {id:'AJ20260605004',source:'直接新建',leadId:'-',client:'赵莹',phone:'137****5526',reason:'房产纠纷',region:'杭州',stage:'审理中',node:'等待第一次开庭',deadline:'2026-06-24 09:30',owner:'周律师',amount:'30-50万',createdAt:'2026-06-05',priority:'高',summary:'房屋抵押未解除，已提交起诉材料。',materials:['购房合同.pdf','付款凭证.pdf'],fees:[['保全费','已收','3000']],tasks:['开庭前电话确认','准备质证意见']},
      {id:'AJ20260522005',source:'直接新建',leadId:'-',client:'孙哲',phone:'135****4470',reason:'债权债务',region:'深圳',stage:'执行中',node:'查询被执行人财产线索',deadline:'2026-06-21 17:00',owner:'许律师',amount:'10-20万',createdAt:'2026-05-22',priority:'低',summary:'借款纠纷已判决，进入执行阶段。',materials:['判决书.pdf','转账记录.png'],fees:[['执行代理费','已收','5000']],tasks:['提交财产调查申请','同步执行进展']},
      {id:'AJ20260510006',source:'线索转入',leadId:'XS20260508009',client:'广州星河科技',phone:'020****9012',reason:'侵权纠纷',region:'广州',stage:'已结案',node:'归档完成',deadline:'2026-06-10 18:00',owner:'刘律师',amount:'50万以上',createdAt:'2026-05-10',priority:'中',summary:'知识产权侵权纠纷调解结案。',materials:['调解书.pdf','归档清单.pdf'],fees:[['尾款','已收','15000']],tasks:['已完成电子归档']}
    ];
    let activeTab='全部',page=1,pageSize=7,currentId='',createMode='direct',simpleMode='',pendingLead=null;
    const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    const tagMap={待建档:'tag-orange',已立案:'tag-blue',证据整理:'tag-purple',庭前准备:'tag-gray',审理中:'tag-green',执行中:'tag-red',已结案:'tag-gray'};
    function init(){applyLeadParams();fillSelects();renderTabs();bindEvents();renderAll();}
    function fillSelects(){fill('sourceFilter',['直接新建','线索转入']);fill('reasonFilter',reasons);fill('regionFilter',regions);fill('stageFilter',stages);fill('ownerFilter',owners);}
    function fill(id,arr){$(id).innerHTML='<option value="">全部</option>'+arr.map(v=>`<option>${v}</option>`).join('');}
    function applyLeadParams(){let q=new URLSearchParams(location.search);if(q.get('from')!=='lead'&&!q.get('leadId'))return;pendingLead={id:q.get('leadId')||'XS20260617001',name:q.get('name')||'线索客户',phone:q.get('phone')||'待补充',reason:q.get('reason')||'合同纠纷',region:q.get('region')||'上海',amount:q.get('amount')||'待评估',summary:q.get('summary')||'由线索管理页转入，待补充案情摘要。'};leadPool.unshift(pendingLead);if(!cases.some(x=>x.leadId===pendingLead.id))cases.unshift(caseFromLead(pendingLead,true));$('handoffText').textContent=`已接收线索管理页转入：${pendingLead.id} / ${pendingLead.name}，已生成待建档草稿。`;$('handoffBanner').classList.add('show');}
    function caseFromLead(l,draft){return {id:`AJ${Date.now().toString().slice(-9)}`,source:'线索转入',leadId:l.id,client:l.name,phone:l.phone,reason:l.reason,region:l.region,stage:'待建档',node:draft?'确认委托与建档信息':'完善委托信息',deadline:nextDay(),owner:'运营专员',amount:l.amount,createdAt:today(),priority:'中',summary:l.summary,materials:[],fees:[],tasks:['核对线索来源','补齐案件基本信息']};}
    function filteredRows(){let k=$('keyword').value.trim().toLowerCase(),start=$('startDate').value,end=$('endDate').value;return cases.filter(r=>{let hay=`${r.id} ${r.client} ${r.phone} ${r.leadId} ${r.reason} ${r.summary}`.toLowerCase();if(activeTab!=='全部'&&r.stage!==activeTab)return false;if(k&&!hay.includes(k))return false;if($('sourceFilter').value&&r.source!==$('sourceFilter').value)return false;if($('reasonFilter').value&&r.reason!==$('reasonFilter').value)return false;if($('regionFilter').value&&r.region!==$('regionFilter').value)return false;if($('stageFilter').value&&r.stage!==$('stageFilter').value)return false;if($('ownerFilter').value&&r.owner!==$('ownerFilter').value)return false;if(start&&r.createdAt<start)return false;if(end&&r.createdAt>end)return false;return true;});}
    function renderAll(){renderMetrics();renderTable();}
    function renderTabs(){$('tabs').innerHTML=['全部',...stages].map(t=>`<button class="case-tab ${t===activeTab?'active':''}" data-tab="${t}">${t}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;page=1;renderTabs();renderAll();});}
    function renderMetrics(){let total=cases.length,fromLead=cases.filter(x=>x.source==='线索转入').length,due=cases.filter(x=>x.stage!=='已结案'&&x.deadline<=nextDay()).length,closed=cases.filter(x=>x.stage==='已结案').length;let data=[['案件总量',total,'全部在库案件'],['线索转入',fromLead,'支持线索页跳转'],['今日待办',due,'含临期节点'],['办理中',cases.filter(x=>!['待建档','已结案'].includes(x.stage)).length,'已进入流程'],['执行中',cases.filter(x=>x.stage==='执行中').length,'执行节点'],['已结案',closed,'完成归档']];$('metrics').innerHTML=data.map(i=>`<div class="metric"><div class="metric-label">${i[0]}</div><div class="metric-value">${i[1]}<span class="metric-note">${i[2]}</span></div></div>`).join('');}
    function renderTable(){renderHead();let data=filteredRows(),rows=data.slice((page-1)*pageSize,page*pageSize);$('totalText').textContent=`共 ${data.length} 条`;$('jumpInput').value=page;if(!rows.length){$('tableBody').innerHTML='<tr><td colspan="11" class="empty">暂无符合条件的案件</td></tr>';$('pager').innerHTML='';return;}$('tableBody').innerHTML=rows.map(rowTpl).join('');$('tableBody').querySelectorAll('[data-action]').forEach(b=>b.onclick=onAction);renderPager(data.length);}
    function renderHead(){$('tableHead').innerHTML='<tr><th class="check-col"><input type="checkbox" id="checkAll"/></th><th class="id-col">案件编号</th><th class="client-col">当事人 / 来源</th><th class="reason-col">案由 / 地区</th><th class="stage-col">当前阶段</th><th class="progress-col">流程进度</th><th class="node-col">当前节点</th><th class="time-col">节点截止</th><th class="owner-col">负责人</th><th class="amount-col">标的额</th><th class="op-col">操作</th></tr>';}
    function rowTpl(r){return `<tr><td class="check-col"><input class="row-check" type="checkbox"/></td><td title="${r.id}">${r.id}</td><td><div class="main-text">${esc(r.client)}</div><div class="sub-text">${esc(r.source)}${r.leadId!=='-'?' / '+esc(r.leadId):''}</div></td><td><div>${esc(r.reason)}</div><div class="sub-text">${esc(r.region)}</div></td><td><span class="tag ${tagMap[r.stage]}">${esc(r.stage)}</span></td><td>${progressTpl(r)}</td><td title="${esc(r.node)}">${esc(r.node)}</td><td>${esc(r.deadline)}</td><td>${esc(r.owner)}</td><td>${esc(r.amount)}</td><td><div class="table-action">${actions(r)}</div></td></tr>`;}
    function progressTpl(r){let p=progressOf(r.stage);return `<div class="progress"><span>${p}%</span><span class="progress-track"><span class="progress-fill" style="width:${p}%"></span></span></div>`;}
    function actions(r){return `<button class="link-btn" data-action="detail" data-id="${r.id}">详情</button><button class="link-btn" data-action="advance" data-id="${r.id}">推进</button><button class="link-btn" data-action="material" data-id="${r.id}">材料</button><button class="link-btn" data-action="fee" data-id="${r.id}">费用</button><button class="link-btn ${r.stage==='已结案'?'muted':'danger'}" data-action="close" data-id="${r.id}">${r.stage==='已结案'?'归档':'结案'}</button>`;}
    function renderPager(total){let pages=Math.max(1,Math.ceil(total/pageSize));if(page>pages)page=pages;let html=`<button class="page-arrow ${page===1?'disabled':''}" data-p="${page-1}">‹</button>`;for(let i=1;i<=pages;i++)html+=`<button class="page-btn ${i===page?'active':''}" data-p="${i}">${i}</button>`;html+=`<button class="page-arrow ${page===pages?'disabled':''}" data-p="${page+1}">›</button>`;$('pager').innerHTML=html;$('pager').querySelectorAll('button').forEach(b=>b.onclick=()=>{let p=Number(b.dataset.p);if(p>=1&&p<=pages){page=p;renderTable();}});}
    function onAction(e){let id=e.currentTarget.dataset.id,act=e.currentTarget.dataset.action;if(act==='detail')openDetail(id);if(act==='advance')openAdvance(id);if(act==='material')openSimple(id,'material');if(act==='fee')openSimple(id,'fee');if(act==='close')closeCase(id);}
    function openDetail(id){let r=caseById(id);$('drawerTitle').textContent=`${r.client} / ${r.id}`;$('drawerSub').textContent=`${r.reason} · ${r.region} · ${r.source}`;$('drawerBody').innerHTML=detailHtml(r);$('drawer').classList.add('show');}
    function detailHtml(r){return block('案件信息',`<div class="detail-grid">${kv('案件编号',r.id)+kv('当事人',r.client)+kv('联系电话',r.phone)+kv('来源',r.source)+kv('线索编号',r.leadId)+kv('标的额',r.amount)+kv('负责人',r.owner)+kv('当前节点',r.node)}</div>`)+block('生命周期',stepsTpl(r))+block('案情摘要',esc(r.summary))+block('材料清单',listTags(r.materials,'暂无材料'))+block('费用记录',feeRows(r))+block('任务记录',timeline(r));}
    function block(t,b){return `<div class="section"><div class="section-head">${t}</div><div class="section-body">${b}</div></div>`;}
    function kv(k,v){return `<div class="kv"><div class="kv-label">${k}</div><div class="kv-value">${esc(v)}</div></div>`;}
    function stepsTpl(r){let idx=stageIndex(r.stage);return `<div class="steps">${stages.map((s,i)=>`<div class="step ${i<idx?'done':''} ${i===idx?'active':''}"><div class="dot">${i+1}</div><div>${s}</div></div>`).join('')}</div>`;}
    function listTags(arr,empty){return arr.length?arr.map(x=>`<span class="tag tag-gray" style="margin:0 8px 8px 0">${esc(x)}</span>`).join(''):empty;}
    function feeRows(r){return `<table><thead><tr><th>项目</th><th>状态</th><th>金额</th></tr></thead><tbody>${r.fees.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${esc(x[2])}</td></tr>`).join('')||'<tr><td colspan="3" class="empty">暂无费用记录</td></tr>'}</tbody></table>`;}
    function timeline(r){return `<div class="timeline">${r.tasks.map(x=>`<div class="time-item">${esc(x)}</div>`).join('')}</div>`;}
    function openCreate(mode){createMode=mode||'direct';$('caseModalTitle').textContent=createMode==='lead'?'线索转案':'新建案件';renderCaseForm();show('caseMask');}
    function renderCaseForm(){let l=pendingLead||leadPool[0];$('caseBody').innerHTML=`<div class="form-item full" style="margin-bottom:14px"><label>创建方式</label><div class="source-switch"><button class="${createMode==='direct'?'active':''}" data-mode="direct">直接新建</button><button class="${createMode==='lead'?'active':''}" data-mode="lead">线索转入</button></div></div>${createMode==='lead'?leadSelect(l):''}<div class="form-grid">${caseFields(l)}</div>`;$('caseBody').querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{createMode=b.dataset.mode;renderCaseForm();});let sel=$('leadSelect');if(sel)sel.onchange=()=>{pendingLead=leadPool.find(x=>x.id===sel.value);renderCaseForm();};}
    function leadSelect(l){return `<div class="section"><div class="section-head">选择线索</div><div class="section-body"><select class="select" id="leadSelect" style="width:260px">${leadPool.map(x=>`<option value="${x.id}" ${x.id===l.id?'selected':''}>${x.id} / ${x.name} / ${x.reason}</option>`).join('')}</select><div class="panel-sub" style="margin-top:8px">${esc(l.summary)}</div></div></div>`;}
    function caseFields(l){return `<div class="form-item"><label>当事人<span class="req">*</span></label><input class="input" id="caseClient" value="${createMode==='lead'?esc(l.name):''}"></div><div class="form-item"><label>联系电话</label><input class="input" id="casePhone" value="${createMode==='lead'?esc(l.phone):''}"></div><div class="form-item"><label>案由<span class="req">*</span></label><select class="select" id="caseReason" style="width:100%">${reasons.map(x=>`<option ${x===(createMode==='lead'?l.reason:'合同纠纷')?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-item"><label>地区</label><select class="select" id="caseRegion" style="width:100%">${regions.map(x=>`<option ${x===(createMode==='lead'?l.region:'上海')?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-item"><label>负责人</label><select class="select" id="caseOwner" style="width:100%">${owners.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-item"><label>标的额</label><input class="input" id="caseAmount" value="${createMode==='lead'?esc(l.amount):'待评估'}"></div><div class="form-item full"><label>案情摘要</label><textarea class="textarea" id="caseSummary">${createMode==='lead'?esc(l.summary):''}</textarea></div>`;}
    function saveCase(){let client=$('caseClient').value.trim();if(!client)return toast('请填写当事人');let l=createMode==='lead'?(pendingLead||leadPool[0]):null;cases.unshift({id:`AJ${Date.now().toString().slice(-9)}`,source:createMode==='lead'?'线索转入':'直接新建',leadId:l?l.id:'-',client,phone:$('casePhone').value,reason:$('caseReason').value,region:$('caseRegion').value,stage:'待建档',node:'完善委托信息与冲突检索',deadline:nextDay(),owner:$('caseOwner').value,amount:$('caseAmount').value,createdAt:today(),priority:'中',summary:$('caseSummary').value,materials:[],fees:[],tasks:['创建案件草稿','等待建档审核']});hide('caseMask');page=1;renderAll();toast('案件已创建');}
    function openAdvance(id){currentId=id;let r=caseById(id),next=stages[Math.min(stageIndex(r.stage)+1,stages.length-1)];$('advanceBody').innerHTML=`<div class="section"><div class="section-head">当前状态</div><div class="section-body">${r.id} · ${r.stage} · ${r.node}</div></div><div class="form-grid"><div class="form-item"><label>推进到阶段</label><select class="select" id="nextStage" style="width:100%">${stages.map(x=>`<option ${x===next?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-item"><label>节点截止</label><input class="input" id="nextDeadline" value="${nextDay()}"></div><div class="form-item full"><label>下一节点</label><input class="input" id="nextNode" value="${nodeOf(next)}"></div><div class="form-item full"><label>处理说明</label><textarea class="textarea" id="advanceNote">阶段推进，系统记录处理节点。</textarea></div></div>`;show('advanceMask');}
    function saveAdvance(){let r=caseById(currentId);r.stage=$('nextStage').value;r.node=$('nextNode').value;r.deadline=$('nextDeadline').value;r.tasks.unshift(`${todayText()} 推进到 ${r.stage}：${$('advanceNote').value}`);hide('advanceMask');renderAll();toast('案件阶段已更新');}
    function openSimple(id,mode){currentId=id;simpleMode=mode;let r=caseById(id);$('simpleTitle').textContent=mode==='material'?'材料管理':'费用管理';$('simpleBody').innerHTML=mode==='material'?materialForm(r):feeForm(r);show('simpleMask');}
    function materialForm(r){return block('已有材料',listTags(r.materials,'暂无材料'))+`<div class="form-item"><label>新增材料名称</label><input class="input" id="simpleInput" placeholder="例如：起诉状.pdf"></div>`;}
    function feeForm(r){return block('已有费用',feeRows(r))+`<div class="form-grid"><div class="form-item"><label>费用项目</label><input class="input" id="feeName" placeholder="例如：律师费尾款"></div><div class="form-item"><label>金额</label><input class="input" id="feeAmount" placeholder="例如：8000"></div></div>`;}
    function saveSimple(){let r=caseById(currentId);if(simpleMode==='material'){let v=$('simpleInput').value.trim();if(!v)return toast('请填写材料名称');r.materials.push(v);r.tasks.unshift(`${todayText()} 新增材料：${v}`);}else{let n=$('feeName').value.trim(),a=$('feeAmount').value.trim();if(!n||!a)return toast('请填写费用项目和金额');r.fees.push([n,'待收',a]);r.tasks.unshift(`${todayText()} 新增费用：${n} ${a}`);}hide('simpleMask');renderAll();toast('已保存');}
    function closeCase(id){let r=caseById(id);if(r.stage==='已结案')return toast('案件已归档');r.stage='已结案';r.node='结案归档';r.deadline=todayText();r.tasks.unshift(`${todayText()} 结案归档`);renderAll();toast('案件已结案');}
    function bindEvents(){$('btnAdd').onclick=()=>openCreate('direct');$('btnLeadCase').onclick=()=>openCreate('lead');$('btnOpenHandoff').onclick=()=>openDetail(cases[0].id);$('btnTemplate').onclick=()=>toast('当前模板：待建档-已立案-证据整理-庭前准备-审理中-执行中-已结案');$('btnSaveCase').onclick=saveCase;$('btnSaveAdvance').onclick=saveAdvance;$('btnSaveSimple').onclick=saveSimple;$('btnSearch').onclick=()=>{page=1;renderAll();};$('btnReset').onclick=resetFilters;$('jumpInput').onkeydown=e=>{if(e.key==='Enter'){page=Math.max(1,Number(e.target.value||1));renderTable();}};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));document.querySelector('[data-close-drawer]').onclick=()=>$('drawer').classList.remove('show');['keyword','sourceFilter','reasonFilter','regionFilter','stageFilter','ownerFilter','startDate','endDate'].forEach(id=>$(id).onchange=()=>{page=1;renderAll();});$('keyword').oninput=()=>{page=1;renderAll();};}
    function resetFilters(){['keyword','sourceFilter','reasonFilter','regionFilter','stageFilter','ownerFilter','startDate','endDate'].forEach(id=>$(id).value='');page=1;renderAll();}
    function caseById(id){return cases.find(x=>x.id===id)||cases[0];}
    function stageIndex(s){return Math.max(0,stages.indexOf(s));}
    function progressOf(s){return s==='已结案'?100:Math.max(8,Math.round((stageIndex(s)+1)/stages.length*100));}
    function nodeOf(s){return {待建档:'完善委托信息与冲突检索',已立案:'提交立案材料并获取案号',证据整理:'整理证据目录与补充材料',庭前准备:'准备庭审提纲与质证意见',审理中:'跟进开庭与调解进展',执行中:'提交执行申请并跟踪财产线索',已结案:'结案归档'}[s]||'推进案件节点';}
    function today(){let d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
    function todayText(){return `${today()} ${String(new Date().getHours()).padStart(2,'0')}:${String(new Date().getMinutes()).padStart(2,'0')}`;}
    function nextDay(){let d=new Date(Date.now()+86400000),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} 18:00`;}
    function show(id){$(id).classList.add('show')}function hide(id){$(id).classList.remove('show')}function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
    init();
  </script>
</body>
</html>
