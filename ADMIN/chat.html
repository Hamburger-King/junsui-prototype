        return `<p>${esc(skill)}已收到你的问题。无接触交通事故中，虽然车辆之间没有发生物理接触，但如果一方行为违法或不当，导致另一方为避险而发生损害，依然可能承担相应法律责任。责任划分通常需要结合具体情形判断：</p><hr><h2>一、责任划分的基本依据</h2><h3><button class="law-ref" type="button" data-law="civil">1. 《中华人民共和国民法典》第一千二百一十三条：</button><span class="law-chip">法规1</span></h3><ul><li>交通事故发生后的赔偿方划分。</li></ul><h3><button class="law-ref" type="button" data-law="road">2. 《中华人民共和国道路交通安全法》第七十六条：</button><span class="law-chip">法规2</span></h3><ul><li>驾驶人违反交通规则的，将依法承担责任。</li></ul><h3>3. 公安机关出具的交通事故认定书：</h3><ul><li>是责任划分的重要依据。</li></ul><hr><h2>二、常见无接触事故责任认定情况举例</h2><table class="answer-table"><thead><tr><th>情况</th><th>是否可能认定有责</th><th>说明</th></tr></thead><tbody><tr><td>A车突然并线，B车为避让撞树</td><td>A车可能承担主要或全部责任</td><td>A车行为导致事故</td></tr><tr><td>A车强行变道，B车为避让发生侧翻</td><td>A车承担主要责任</td><td>B车为避险而损失</td></tr><tr><td>A车正常行驶，B车操作失误自行撞车</td><td>B车自行承担责任</td><td>无证据显示A车有过错</td></tr><tr><td>行人乱穿马路，车辆紧急避让撞他物</td><td>行人可能承担主要责任</td><td>行人行为直接导致事故</td></tr><tr><td>行车记录仪或目击者证明责任方存在</td><td>责任方须依法承担</td><td>证据清晰很关键</td></tr></tbody></table><hr><h2>三、责任认定的关键要素</h2><ol><li><strong>是否有违法或不当驾驶行为</strong>（如强行变道、占道、急刹车等）</li><li><strong>事故发生是否与该行为有因果关系</strong></li><li><strong>受害方是否采取合理避让措施</strong></li><li><strong>现场证据是否完整</strong>：行车记录仪、监控视频、目击证人、事故现场照片等</li></ol>`;

      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms)); function scrollToBottom(smooth = false) { const top = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight); if (smooth) { window.scrollTo({ top, behavior: 'smooth' }); page.scrollTo?.({ top: page.scrollHeight, behavior: 'smooth' }); } else { window.scrollTo(0, top); page.scrollTop = page.scrollHeight; } }
