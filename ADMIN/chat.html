      <symbol id="shield" viewBox="0 0 24 24"><path d="M12 3 19 6v5c0 4.3-2.8 8.1-7 10-4.2-1.9-7-5.7-7-10V6l7-3Zm-3 9 2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="up" viewBox="0 0 24 24"><path d="M12 19V5M6 11l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="back" viewBox="0 0 24 24"><path d="m15 5-6 7 6 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="headset" viewBox="0 0 24 24"><path d="M4 13a8 8 0 0 1 16 0v4a3 3 0 0 1-3 3h-2M4 13v4h3v-5H5a1 1 0 0 0-1 1Zm16 0v4h-3v-5h2a1 1 0 0 1 1 1Zm-8 7h3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    </svg>

    <button class="side-back" aria-label="返回"><svg><use href="#back"/></svg></button>
    <section class="stage" aria-label="智合 AI 对话首页">
      <h1 class="greeting">晚上好 满萃金奖深烘冰美式，需要我为你做什么</h1>
      <section class="dialog" id="dialog" aria-live="polite" aria-label="对话内容"></section>
      <form class="composer" id="composer">
        <textarea class="prompt" id="prompt" rows="2" placeholder="请直接向我提问，或从上传文件开始（Ctrl/Shift + Enter 换行）" aria-label="请输入问题"></textarea>
        <div class="files" id="files" aria-live="polite"></div>
        <div class="composer-foot">
          <button class="pill" id="fileBtn" type="button"><svg><use href="#paperclip"/></svg>选择文件</button>
          <input id="fileInput" type="file" multiple hidden />
          <span class="spacer"></span><button class="assist" id="polishBtn" type="button"><svg width="15" height="15"><use href="#spark"/></svg>问题润色</button><span class="divider" aria-hidden="true"></span>
          <button class="send" id="sendBtn" type="submit" aria-label="发送" disabled><svg><use href="#up"/></svg></button>
        </div>
      </form>
      <p class="chat-footnote">内容由智能法律助手生成，仅供参考，请结合具体证据与专业意见判断</p>
    </section>
    <button class="help" type="button" aria-label="联系客服"><svg><use href="#headset"/></svg></button>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <aside class="law-panel" id="lawPanel" aria-hidden="true" aria-label="法规阅读">
      <button class="law-close" id="lawClose" type="button" aria-label="关闭法规侧栏">&times;</button>
      <h2>摘要阅读</h2>
      <div id="lawPanelBody"></div>
    </aside>
  </main>
  <script>
    (() => {
      const page = document.querySelector('.page');
      const form = document.getElementById('composer');
      const prompt = document.getElementById('prompt');
      const send = document.getElementById('sendBtn');
      const dialog = document.getElementById('dialog');
      const fileBtn = document.getElementById('fileBtn');
      const fileInput = document.getElementById('fileInput');
      const filesBox = document.getElementById('files');
      const polishBtn = document.getElementById('polishBtn');
      const toastBox = document.getElementById('toast');
      const lawPanel = document.getElementById('lawPanel');
      const lawPanelBody = document.getElementById('lawPanelBody');
      const lawClose = document.getElementById('lawClose');
      const lawPanelTitle = lawPanel.querySelector('h2');
      let fileNames = [];
      let skill = '智能规划';
      let toastTimer = null;
      let typeToken = 0;
      const userAvatar = 'https://thirdwx.qlogo.cn/mmopen/vi_32/PiajxSqBRaELGMycaxcS4V2dNSJfiaOiaibeAvynhs43gIFaCM9SXaYGT3jZzm1R77SsOUxLL6EwXg1qeDDqh0wDDhx7beEiaqOqbXCBCAYbsqyYqNZicZzmNOicQ/132';
      const defaultGreeting = '晚上好 满萃金奖深烘冰美式，需要我为你做什么';

      const esc = (value) => String(value).replace(/[&<>"']/g, (char) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
      const toast = (text) => {
        toastBox.textContent = text;
        toastBox.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toastBox.classList.remove('show'), 2200);
      };
      const resizePrompt = () => {
        prompt.style.height = 'auto';
        prompt.style.height = Math.min(prompt.scrollHeight, 132) + 'px';
      };
      const updateSend = () => {
        const ready = Boolean(prompt.value.trim()) || fileNames.length > 0;
        send.disabled = !ready;
        send.classList.toggle('ready', ready);
      };
      const renderFiles = () => {
        filesBox.innerHTML = fileNames.map((name, index) =>
          `<span class="file-chip"><span>${esc(name)}</span><button type="button" aria-label="移除 ${esc(name)}" data-i="${index}">x</button></span>`
        ).join('');
      };
      const laws = {
        civil: { label: '法规1', title: '《中华人民共和国民法典》', article: '第一千二百一十三条', date: '2021-01-01施行', body: '机动车发生交通事故造成损害，属于该机动车一方责任的，先由承保机动车强制保险的保险人在强制保险责任限额范围内予以赔偿；不足部分，依照商业保险合同约定赔偿；仍然不足或者没有投保商业保险的，由侵权人赔偿。' },
        road: { label: '法规2', title: '《中华人民共和国道路交通安全法》', article: '第七十六条', date: '2021-04-29施行', body: '机动车发生交通事故造成人身伤亡、财产损失的，由保险公司在机动车第三者责任强制保险责任限额范围内赔偿；不足部分，按照事故各方过错比例承担赔偿责任。' }
      };

      function bindServicePack() { const track = document.getElementById('serviceTrack'); if (!track) return; const dots = [...document.querySelectorAll('.service-dot')], sync = () => dots.forEach((dot, i) => dot.classList.toggle('active', i === Math.round(track.scrollLeft / track.clientWidth))); let down = false, x = 0, left = 0; const start = (e) => { if (e.target.closest('.service-cta')) return; e.preventDefault(); down = true; x = e.clientX; left = track.scrollLeft; track.classList.add('dragging'); if (e.pointerId !== undefined) track.setPointerCapture(e.pointerId); }, move = (e) => { if (down) { e.preventDefault(); track.scrollLeft = left - e.clientX + x; } }, end = () => { down = false; track.classList.remove('dragging'); sync(); }; track.addEventListener('scroll', () => requestAnimationFrame(sync)); dots.forEach((dot, i) => dot.addEventListener('click', () => track.scrollTo({ left: i * track.clientWidth, behavior: 'smooth' }))); track.addEventListener('pointerdown', start, true); track.addEventListener('pointermove', move); track.addEventListener('mousedown', start, true); document.addEventListener('mousemove', move); ['pointerup','pointercancel','pointerleave','mouseup'].forEach((name) => (name === 'mouseup' ? document : track).addEventListener(name, end)); sync(); }

      function answerBodyHtml() {
        return `<p>${esc(skill)}已收到你的问题。无接触交通事故中，虽然车辆之间没有发生物理接触，但如果一方行为违法或不当，导致另一方为避险而发生损害，依然可能承担相应法律责任。责任划分通常需要结合具体情形判断：</p><hr><h2>一、责任划分的基本依据</h2><h3><button class="law-ref" type="button" data-law="civil">1. 《中华人民共和国民法典》第一千二百一十三条：</button><span class="law-chip">法规1</span></h3><ul><li>交通事故发生后的赔偿方划分。</li></ul><h3><button class="law-ref" type="button" data-law="road">2. 《中华人民共和国道路交通安全法》第七十六条：</button><span class="law-chip">法规2</span></h3><ul><li>驾驶人违反交通规则的，将依法承担责任。</li></ul><h3>3. 公安机关出具的交通事故认定书：</h3><ul><li>是责任划分的重要依据。</li></ul><hr><h2>二、常见无接触事故责任认定情况举例</h2><table class="answer-table"><thead><tr><th>情况</th><th>是否可能认定有责</th><th>说明</th></tr></thead><tbody><tr><td>A车突然并线，B车为避让撞树</td><td>A车可能承担主要或全部责任</td><td>A车行为导致事故</td></tr><tr><td>A车强行变道，B车为避让发生侧翻</td><td>A车承担主要责任</td><td>B车为避险而损失</td></tr><tr><td>A车正常行驶，B车操作失误自行撞车</td><td>B车自行承担责任</td><td>无证据显示A车有过错</td></tr><tr><td>行人乱穿马路，车辆紧急避让撞他物</td><td>行人可能承担主要责任</td><td>行人行为直接导致事故</td></tr><tr><td>行车记录仪或目击者证明责任方存在</td><td>责任方须依法承担</td><td>证据清晰很关键</td></tr></tbody></table><hr><h2>三、责任认定的关键要素</h2><ol><li><strong>是否有违法或不当驾驶行为</strong>（如强行变道、占道、急刹车等）</li><li><strong>事故发生是否与该行为有因果关系</strong></li><li><strong>受害方是否采取合理避让措施</strong></li><li><strong>现场证据是否完整</strong>：行车记录仪、监控视频、目击证人、事故现场照片等</li></ol>`;
      }

      function answerHtml(question, names = []) {
        const title = question || '请处理我上传的文件';
        const fileHtml = names.length
          ? `<div class="msg-files">${names.map((name) => `<span>${esc(name)}</span>`).join('')}</div>`
          : '';
        return `<section class="chat-turn"><span class="chat-avatar user"><img src="${userAvatar}" alt="用户头像" referrerpolicy="no-referrer"></span><h2 class="user-question">${esc(title)}</h2>${fileHtml}</section><section class="chat-turn"><span class="chat-avatar ai">AI</span><article class="answer-doc typing" id="answerDoc"></article></section>`;
      }

      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms)); function scrollToBottom(smooth = false) { const top = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight); if (smooth) { window.scrollTo({ top, behavior: 'smooth' }); page.scrollTo?.({ top: page.scrollHeight, behavior: 'smooth' }); } else { window.scrollTo(0, top); page.scrollTop = page.scrollHeight; } }
      async function typeNode(source, target, token) {
        for (const node of source.childNodes) {
          if (token !== typeToken) return;
          if (node.nodeType === Node.TEXT_NODE) for (const char of node.textContent) { if (token !== typeToken) return; target.append(char); scrollToBottom(); await sleep(3); }
          else { const clone = node.cloneNode(false); target.appendChild(clone); scrollToBottom(); await typeNode(node, clone, token); }
        }
      }
      async function typeAnswer() {
        const doc = document.getElementById('answerDoc');
        const template = document.createElement('template');
        const token = ++typeToken;
        template.innerHTML = answerBodyHtml();
        doc.innerHTML = '';
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) doc.innerHTML = template.innerHTML;
        else await typeNode(template.content, doc, token);
        if (token === typeToken) { doc.classList.remove('typing'); scrollToBottom(true); }
      }

      function showAnswer(question, names) {
        page.classList.add('chatting');
        dialog.innerHTML = answerHtml(question, names);
        lawPanel.classList.remove('open');
        lawPanel.setAttribute('aria-hidden', 'true');
        typeAnswer();
        scrollToBottom(true);
      }

      function sendMsg() {
        const text = prompt.value.trim();
        if (!text && !fileNames.length) {
          toast('请输入问题或选择文件');
          prompt.focus();
          return;
        }
        showAnswer(text, [...fileNames]);
        prompt.value = '';
        fileNames = [];
        renderFiles();
        resizePrompt();
        updateSend();
      }

      prompt.addEventListener('input', () => { resizePrompt(); updateSend(); });
      prompt.addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !event.shiftKey && !event.ctrlKey) {
          event.preventDefault();
          sendMsg();
        }
      });
      form.addEventListener('submit', (event) => { event.preventDefault(); sendMsg(); });
      fileBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', () => {
        fileNames = [...fileInput.files].map((file) => file.name);
        renderFiles();
        updateSend();
        toast(fileNames.length ? `已选择 ${fileNames.length} 个文件` : '未选择文件');
      });
      filesBox.addEventListener('click', (event) => {
        const index = event.target.dataset.i;
        if (index === undefined) return;
        fileNames.splice(Number(index), 1);
        renderFiles();
        updateSend();
        toast('已移除附件');
      });
      function openLawPanel(key) {
        if (!laws[key]) return;
        lawPanelTitle.textContent = '摘要阅读';
        lawPanelBody.innerHTML = Object.values(laws).map((law) => `<h3><mark>${law.label}</mark> ${law.title}</h3><div class="reply-box">法律依据内容<br>${law.title} ${law.article}：${law.label}</div><p class="law-meta"><span></span><span>${law.date}</span><mark>有效</mark></p><p><strong>${law.title} ${law.article}</strong></p><p>${law.body}</p>`).join('<hr>');
        lawPanel.classList.add('open');
        lawPanel.setAttribute('aria-hidden', 'false');
      }
      function openPanel(title, html) { lawPanel.querySelector('[data-qr-mask]')?.remove(); lawPanelTitle.textContent = title; lawPanelBody.innerHTML = html; lawPanel.classList.add('open'); lawPanel.setAttribute('aria-hidden', 'false'); } function showQr(title, price) { lawPanel.querySelector('[data-qr-mask]')?.remove(); const marks = new Set([0,1,2,6,7,8,9,11,15,17,18,19,20,24,25,26,28,30,32,34,36,40,44,46,48,50,52,54,55,56,58,60,62,64,66,68,70,72,73,74,78,79,80]); lawPanel.insertAdjacentHTML('beforeend', `<div class="qr-mask" data-qr-mask><section class="qr-modal" role="dialog" aria-modal="true" aria-label="支付二维码"><h3>${esc(title)}</h3><p>请使用微信或支付宝扫码支付</p><div class="qr-code" aria-hidden="true">${Array.from({length:81},(_,i)=>'<i class="'+(marks.has(i)?'on':'')+'"></i>').join('')}</div><p>${esc(price || '确认金额后支付')}</p><button class="service-cta" type="button" data-close-qr>我知道了</button></section></div>`); }
      function openCasePanel() { openPanel('案件登记表', `<form class="service-form" data-case-form><h3>案件调查表单</h3><p class="intro">按案件登记表模板收集用户信息和案件资料，便于 AI 输出更完整的法律意见。</p><section class="form-card"><h3>1 用户信息</h3><input type="text" placeholder="姓名 / 手机号"><label><input name="role" type="radio" checked> 当事人</label><label><input name="role" type="radio"> 家属或代理人</label></section><section class="form-card"><h3>2 案件资料</h3><textarea placeholder="请填写事故时间、地点、经过、现有证据和对方信息"></textarea></section><section class="form-card"><h3>3 当前诉求</h3><textarea placeholder="例如责任划分、赔偿金额、立案起诉、文书生成或律师代理"></textarea></section><div class="form-actions"><button type="submit">生成法律意见书</button><button type="button" data-close-panel>稍后填写</button></div></form>`); }
      function openOpinionPanel() { openPanel('AI法律意见书', `<h3>无接触交通事故初步意见</h3><div class="reply-box">已根据案件登记表补充用户信息、案件事实、证据材料和当前诉求，形成初步处理路径。</div><p><strong>建议路径：</strong>先固定行车记录仪、监控、事故认定书等证据，再判断对方是否存在违法或不当驾驶行为。</p><p><strong>下一步：</strong>可继续生成起诉状、证据目录等文书，或申请律师助理/律师一对一复核。</p><div class="form-actions"><button type="button" data-panel="human">申请人工复核</button><button type="button" data-close-panel>稍后处理</button></div>`); }
      function openHumanPanel() { openPanel('一对一付费服务', `<p class="intro">付款后可申请客服接待，由律师助理或律师在管理后台补充案件登记表；服务完成后可标记结案。</p><section class="pay-card"><strong>律师助理接待</strong><p>适合资料整理、流程说明、基础答疑和登记表补全。</p><div class="price">￥19.9</div><button class="service-cta" type="button" data-pay="assistant" data-pay-title="律师助理接待" data-pay-price="￥19.9">申请律师助理</button></section><section class="pay-card"><strong>律师一对一</strong><p>适合复杂案情、策略判断、证据风险和正式处理建议。</p><div class="price">￥59.9</div><button class="service-cta" type="button" data-pay="lawyer" data-pay-title="律师一对一" data-pay-price="￥59.9">申请律师服务</button></section>`); }
      dialog.addEventListener('click', (event) => {
        const panelButton = event.target.closest('[data-panel]');
        if (panelButton?.dataset.panel === 'case') { openCasePanel(); return; }
        if (panelButton?.dataset.panel === 'human') { openHumanPanel(); return; }
        const lawButton = event.target.closest('.law-ref');
        if (lawButton) openLawPanel(lawButton.dataset.law);
      });
      lawPanel.addEventListener('click', (event) => { const panel = event.target.closest('[data-panel]')?.dataset.panel, pay = event.target.closest('[data-pay]'); if (event.target.closest('[data-close-qr]') || event.target.matches('[data-qr-mask]')) { lawPanel.querySelector('[data-qr-mask]')?.remove(); return; } if (panel === 'human') { openHumanPanel(); return; } if (pay) { showQr(pay.dataset.payTitle || lawPanelTitle.textContent, pay.dataset.payPrice || lawPanel.querySelector('.price')?.textContent.trim()); return; } if (event.target.closest('[data-close-panel]')) lawClose.click(); }); lawPanel.addEventListener('submit', (event) => { event.preventDefault(); if (event.target.matches('[data-case-form]')) { openOpinionPanel(); toast('已生成法律意见书'); return; } if (event.target.matches('[data-pay-form]')) { showQr(lawPanelTitle.textContent, lawPanel.querySelector('.price')?.textContent.trim()); return; } toast('已提交服务需求'); lawClose.click(); });
      lawClose.addEventListener('click', () => {
        lawPanel.classList.remove('open');
        lawPanel.setAttribute('aria-hidden', 'true');
      });
      polishBtn.addEventListener('click', () => {
        const text = prompt.value.trim();
        if (!text) {
          toast('先输入问题，再帮你润色');
          prompt.focus();
          return;
        }
        prompt.value = `请将以下问题整理为清晰、专业、可执行的法律提问：\n${text}`;
        resizePrompt();
        updateSend();
        toast('已润色为结构化提问');
      });
      document.querySelector('.side-back').addEventListener('click', () => {
        if (page.classList.contains('chatting')) {
          page.classList.remove('chatting');
          dialog.innerHTML = '';
          toast('已回到首页');
          return;
        }
        toast('当前已在首页');
      });
      document.querySelector('.help').addEventListener('click', () => {
        openHumanPanel();
      });
      updateSend();
    })();
  </script>
