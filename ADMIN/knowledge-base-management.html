<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>知识库管理</title>
  <style>
    :root{--primary:#165DFF;--primary-hover:#0E42D2;--primary-light:#E8F3FF;--text-1:#1D2129;--text-2:#4E5969;--text-3:#86909C;--line:#E5E6EB;--line-2:#F2F3F5;--bg:#F7F8FA;--success:#00B578;--warning:#FF7D00;--danger:#F53F3F;--purple:#722ED1;--shadow:0 4px 12px rgba(0,0,0,.04)}
    *{box-sizing:border-box}body{margin:0;font:14px "PingFangSC","PingFang SC","Microsoft YaHei",Arial,sans-serif;background:var(--bg);color:var(--text-1)}button,input,select,textarea{font:inherit}.page{min-width:1480px;min-height:100vh;padding:12px}.page-shell,.panel,.right-panel,.left-panel{display:flex;flex-direction:column}.page-shell{min-height:calc(100vh - 24px)}.panel{flex:1;min-height:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}
    .panel-head{min-height:66px;padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:18px}.panel-title{font-size:18px;font-weight:700;line-height:1.4}.panel-sub{margin-top:4px;color:var(--text-3);font-size:12px}.head-actions,.toolbar-actions,.table-action{display:flex;align-items:center;gap:10px}
    .workspace{display:grid;grid-template-columns:268px 1fr;gap:12px;padding:12px;background:var(--bg);flex:1;min-height:0}.left-panel,.right-panel{min-height:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);overflow:hidden}.left-head,.right-head{min-height:58px;padding:12px 16px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:10px}.left-title,.right-title{font-size:16px;font-weight:700}.tree-search{padding:12px 16px 10px;border-bottom:1px solid var(--line-2)}.tree-body{padding:10px 8px 12px 10px;overflow:auto;flex:1}.tree-root{margin:0;padding:0;list-style:none}.tree-node{height:36px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:6px;cursor:pointer;color:var(--text-2);margin-bottom:4px}.tree-node:hover{background:#F7F8FA}.tree-node.active{background:#EDF4FF;color:var(--primary)}.tree-node .count{margin-left:auto;color:var(--text-3);font-size:12px}.tree-dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.75}
    .toolbar{padding:12px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--line-2)}.filter-item{display:inline-flex;align-items:center;gap:8px;color:var(--text-2);font-size:13px}.input,.select,.jump-input,.textarea{height:32px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text-1);padding:0 10px;outline:none}.input:focus,.select:focus,.jump-input:focus,.textarea:focus{border-color:var(--primary);box-shadow:0 0 0 2px rgba(22,93,255,.08)}.select{appearance:none;padding-right:26px;background-image:linear-gradient(45deg,transparent 50%,#9aa4b2 50%),linear-gradient(135deg,#9aa4b2 50%,transparent 50%);background-position:calc(100% - 14px) 13px,calc(100% - 9px) 13px;background-size:5px 5px;background-repeat:no-repeat}.keyword{width:260px}.select{width:130px}.toolbar-actions{margin-left:auto}
    .btn,.link-btn,.page-btn,.page-arrow{cursor:pointer;transition:all .18s ease}.btn{height:32px;padding:0 14px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;gap:6px}.btn svg{width:15px;height:15px}.btn:hover{border-color:#c9cdd4;background:#f7f8fa}.btn-primary{background:var(--primary);border-color:var(--primary);color:#fff}.btn-primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}.btn-danger{color:var(--danger);border-color:#ffd0cf;background:#fff6f5}.btn-ghost{background:#F2F3F5;border-color:#F2F3F5}
    .table-wrap{padding:12px 16px 2px;flex:1;min-height:0;overflow:auto}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:13px}thead th{height:44px;padding:0 12px;text-align:left;font-weight:600;background:#F7F8FA;border-top:1px solid var(--line);border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap}tbody td{height:54px;padding:8px 12px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);background:#fff;color:var(--text-2);vertical-align:middle;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}thead th:first-child,tbody td:first-child{border-left:1px solid var(--line)}.check-col{width:44px;text-align:center}.id-col{width:134px}.title-col{width:270px}.cat-col{width:126px}.source-col{width:122px}.tag-col{width:210px}.status-col{width:96px}.time-col{width:146px}.ref-col{width:84px}.op-col{width:240px}.row-check,#checkAll{width:14px;height:14px;accent-color:var(--primary);cursor:pointer}
    .main-text{color:var(--text-1);font-weight:500}.sub-text{margin-top:3px;color:var(--text-3);font-size:12px}.tag{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:4px;font-size:12px;margin:0 4px 4px 0}.tag-blue{background:#E8F3FF;color:#165DFF}.tag-green{background:#E8FFEA;color:#2BA471}.tag-orange{background:#FFF3E8;color:#FF7D00}.tag-red{background:#FFECE8;color:#F53F3F}.tag-gray{background:#F2F3F5;color:#4E5969}.tag-purple{background:#F3E8FF;color:#722ED1}.link-btn{border:0;background:transparent;padding:0;color:var(--primary);font-size:13px}.link-btn.danger{color:var(--danger)}.link-btn.muted{color:var(--text-2)}.empty{padding:42px 16px;text-align:center;color:#B0B7C3}
    .footer{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 16px;color:var(--text-2);font-size:13px}.pagination,.pager,.jump{display:flex;align-items:center;gap:8px}.page-btn,.page-arrow,.jump-input{min-width:32px;height:32px;border:1px solid var(--line);border-radius:2px;background:#fff;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center}.page-arrow{background:#F7F8FA}.page-arrow.disabled{opacity:.45;cursor:not-allowed}.page-btn.active{border-color:var(--primary);color:var(--primary)}.jump-input{width:46px;text-align:center}
    .mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.34);z-index:9000;align-items:center;justify-content:center}.mask.show{display:flex}.modal{width:780px;max-height:86vh;background:#fff;border-radius:8px;box-shadow:0 18px 48px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden}.modal.sm{width:520px}.modal.lg{width:980px}.modal-header{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line);font-weight:600}.modal-close{border:0;background:transparent;color:var(--text-3);font-size:20px;cursor:pointer}.modal-body{padding:18px;overflow:auto}.modal-footer{display:flex;justify-content:flex-end;gap:10px;padding:12px 18px 18px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px 16px}.form-item{display:flex;flex-direction:column;gap:8px}.form-item.full{grid-column:1 / 3}.form-item label{font-size:13px;color:var(--text-2)}.textarea{height:auto;min-height:92px;padding:10px;resize:vertical}.req{color:var(--danger);margin-left:2px}.section{border:1px solid var(--line);border-radius:6px;overflow:hidden;margin-bottom:14px}.section-head{height:40px;padding:0 14px;display:flex;align-items:center;background:#F7F8FA;font-weight:600}.section-body{padding:14px}.upload-box{height:120px;border:1px dashed #B8C4D6;border-radius:6px;background:#FBFCFD;display:flex;align-items:center;justify-content:center;color:var(--text-3)}.desensitized{background:#F7F8FA;border:1px solid var(--line);border-radius:6px;padding:12px;line-height:1.8;color:var(--text-2)}
    .drawer{position:fixed;right:0;top:0;bottom:0;width:660px;background:#fff;box-shadow:-12px 0 32px rgba(0,0,0,.14);z-index:9100;transform:translateX(104%);transition:transform .24s ease;display:flex;flex-direction:column}.drawer.show{transform:translateX(0)}.drawer-header{height:58px;padding:0 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.drawer-title{font-size:16px;font-weight:700}.drawer-body{padding:18px;overflow:auto}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}.kv{line-height:1.6}.kv-label{color:var(--text-3);font-size:12px}.kv-value{color:var(--text-1)}.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);padding:9px 14px;border-radius:4px;background:#1D2129;color:#fff;z-index:9500;display:none}.toast.show{display:block}
  </style>
</head>
<body>
  <div class="page"><div class="page-shell"><section class="panel">
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true" focusable="false">
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    </svg>
    <div class="panel-head">
      <div><div class="panel-title">知识库管理</div><div class="panel-sub">统一管理法律法规、裁判规则、办案指引、常见问答、历史文书与模板文书。</div></div>
      <div class="head-actions">
        <button class="btn btn-primary" id="btnAdd"><svg><use href="#i-plus"/></svg>新建</button>
      </div>
    </div>
    <div class="workspace">
      <aside class="left-panel">
        <div class="left-head"><div><div class="left-title">知识分类</div><div class="panel-sub">分类新增</div></div><button class="btn btn-ghost" id="btnCategory">新增</button></div>
        <div class="tree-search"><input class="input" id="treeKeyword" placeholder="搜索分类" style="width:100%"></div>
        <div class="tree-body"><ul class="tree-root" id="categoryTree"></ul></div>
      </aside>
      <main class="right-panel">
        <div class="right-head"><div><div class="right-title" id="rightTitle">知识条目</div><div class="panel-sub" id="rightSub">按标题、正文、案由、标签、文书类型检索知识材料。</div></div></div>
        <div class="toolbar">
          <div class="filter-item"><input class="input keyword" id="keyword" placeholder="搜索标题、正文、案由、标签" /></div>
          <div class="filter-item"><label>类型：</label><select class="select" id="typeFilter"></select></div>
          <div class="filter-item"><label>阶段：</label><select class="select" id="stageFilter"></select></div>
          <div class="filter-item"><label>状态：</label><select class="select" id="statusFilter"></select></div>
          <div class="toolbar-actions"><button class="btn" id="btnSimilar">相似文书检索</button><button class="btn" id="btnReset">重置</button><button class="btn btn-primary" id="btnSearch">查询</button></div>
        </div>
        <div class="table-wrap"><table><thead id="tableHead"></thead><tbody id="tableBody"></tbody></table></div>
        <div class="footer"><div id="totalText">共 0 条</div><div class="pagination"><div class="pager" id="pager"></div><div class="jump">前往 <input class="jump-input" id="jumpInput" value="1" /> 页</div></div></div>
      </main>
    </div>
  </section></div></div>
  <aside class="drawer" id="drawer"><div class="drawer-header"><div><div class="drawer-title" id="drawerTitle">详情</div><div class="panel-sub" id="drawerSub"></div></div><button class="modal-close" data-close-drawer>×</button></div><div class="drawer-body" id="drawerBody"></div></aside>
  <div class="mask" id="entryMask"><div class="modal lg"><div class="modal-header"><span id="entryTitle">新建</span><button class="modal-close" data-close="entryMask">×</button></div><div class="modal-body" id="entryBody"></div><div class="modal-footer"><button class="btn" data-close="entryMask">取消</button><button class="btn btn-primary" id="btnSaveEntry">提交入库</button></div></div></div>
  <div class="mask" id="reviewMask"><div class="modal"><div class="modal-header"><span>入库审核</span><button class="modal-close" data-close="reviewMask">×</button></div><div class="modal-body" id="reviewBody"></div><div class="modal-footer"><button class="btn btn-danger" id="btnReject">退回</button><button class="btn btn-primary" id="btnApprove">审核通过</button></div></div></div>
  <div class="mask" id="manageMask"><div class="modal"><div class="modal-header"><span id="manageTitle">新增</span><button class="modal-close" data-close="manageMask">×</button></div><div class="modal-body" id="manageBody"></div><div class="modal-footer"><button class="btn" data-close="manageMask">取消</button><button class="btn btn-primary" id="btnSaveManage">保存</button></div></div></div>
  <div class="toast" id="toast"></div>
  <script>
    const categories=['全部','法律法规','裁判规则','办案指引','常见问答','历史文书','模板文书'],types=['法规','裁判规则','办案指引','问答','起诉状','合同模板','律师函'],stages=['咨询','立案','庭前','审理','执行','归档'],statuses=['已发布','待审核','已退回','草稿'];
    const rows=[
      {id:'KB20260617001',title:'民事诉讼证据规则摘要',summary:'围绕举证责任、证据交换、电子数据真实性归纳要点。',cat:'法律法规',type:'法规',source:'手动编辑',tags:['证据','民事诉讼','审理'],stage:'审理',status:'已发布',refs:36,updated:'2026-06-17 09:20',body:'新增法律法规、裁判规则、办案指引、常见问答、历史文书、模板文书等分类。'},
      {id:'KB20260616012',title:'买卖合同纠纷裁判规则',summary:'提炼逾期交付、质量异议、对账确认与违约金调整裁判观点。',cat:'裁判规则',type:'裁判规则',source:'文书脱敏',tags:['合同纠纷','违约金','裁判规则'],stage:'审理',status:'待审核',refs:18,updated:'2026-06-16 17:42',body:'历史文书中的姓名、身份证、手机号、公司名、地址、金额等敏感信息已脱敏。'},
      {id:'KB20260615007',title:'离婚案件财产分割办案指引',summary:'覆盖咨询接待、证据清单、保全申请、庭审发问与调解策略。',cat:'办案指引',type:'办案指引',source:'文件上传',tags:['婚姻家事','财产分割','庭前'],stage:'庭前',status:'已发布',refs:42,updated:'2026-06-15 14:16',body:'支持上传 Word、PDF、TXT、Markdown、图片 OCR 文本等知识材料。'},
      {id:'KB20260613009',title:'劳动仲裁常见问答',summary:'整理解除劳动合同、工资流水、加班费与经济补偿常见咨询口径。',cat:'常见问答',type:'问答',source:'手动编辑',tags:['劳动争议','咨询','FAQ'],stage:'咨询',status:'已发布',refs:64,updated:'2026-06-13 10:34',body:'支持按标题、正文、案由、标签、文书类型检索知识材料。'},
      {id:'KB20260612003',title:'借款纠纷起诉状脱敏样例',summary:'历史文书脱敏后保留诉讼请求、事实理由与证据结构。',cat:'历史文书',type:'起诉状',source:'文书脱敏',tags:['债权债务','历史文书','起诉状'],stage:'立案',status:'待审核',refs:11,updated:'2026-06-12 11:08',body:'根据当前案情、案由和诉求检索知识库中相似文书或优秀案例。'},
      {id:'KB20260610005',title:'律师函模板：房屋买卖违约',summary:'适用于房屋买卖合同解除、尾款催告、违约责任主张。',cat:'模板文书',type:'律师函',source:'文件上传',tags:['房产纠纷','模板','律师函'],stage:'咨询',status:'草稿',refs:9,updated:'2026-06-10 18:22',body:'记录文书生成时引用过的知识条目、模板、历史文书和使用人。'}
    ];
    let activeCat='全部',page=1,pageSize=6,currentId='',manageMode='category';
    const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    const tagMap={已发布:'tag-green',待审核:'tag-orange',已退回:'tag-red',草稿:'tag-gray'};
    function init(){fillSelects();bindEvents();renderAll();}
    function fillSelects(){fill('typeFilter',types);fill('stageFilter',stages);fill('statusFilter',statuses)}
    function fill(id,arr){$(id).innerHTML='<option value="">全部</option>'+arr.map(v=>`<option>${v}</option>`).join('')}
    function renderAll(){renderTree();renderTable();}
    function renderTree(){let key=$('treeKeyword').value.trim();$('categoryTree').innerHTML=categories.filter(c=>!key||c.includes(key)).map(c=>`<li class="tree-node ${c===activeCat?'active':''}" data-cat="${c}"><span class="tree-dot"></span><span>${c}</span><span class="count">${c==='全部'?rows.length:rows.filter(x=>x.cat===c).length}</span></li>`).join('');$('categoryTree').querySelectorAll('li').forEach(n=>n.onclick=()=>{activeCat=n.dataset.cat;page=1;renderTree();renderTable();})}
    function filteredRows(){let k=$('keyword').value.trim().toLowerCase();return rows.filter(r=>{let hay=`${r.id} ${r.title} ${r.summary} ${r.body} ${r.cat} ${r.type} ${r.source} ${r.tags.join(' ')}`.toLowerCase();if(activeCat!=='全部'&&r.cat!==activeCat)return false;if(k&&!hay.includes(k))return false;if($('typeFilter').value&&r.type!==$('typeFilter').value)return false;if($('stageFilter').value&&r.stage!==$('stageFilter').value)return false;if($('statusFilter').value&&r.status!==$('statusFilter').value)return false;return true;})}
    function renderHead(){$('tableHead').innerHTML='<tr><th class="check-col"><input id="checkAll" type="checkbox"></th><th class="id-col">知识编号</th><th class="title-col">标题 / 摘要</th><th class="cat-col">所属分类</th><th class="source-col">入库方式</th><th class="tag-col">标签</th><th class="status-col">审核状态</th><th class="time-col">最近更新</th><th class="ref-col">引用</th><th class="op-col">操作</th></tr>'}
    function renderTable(){renderHead();let data=filteredRows(),list=data.slice((page-1)*pageSize,page*pageSize);$('totalText').textContent=`共 ${data.length} 条`;$('jumpInput').value=page;$('rightTitle').textContent='知识条目';$('rightSub').textContent=activeCat==='全部'?'按标题、正文、案由、标签、文书类型检索知识材料。':`当前分类：${activeCat}`;if(!list.length){$('tableBody').innerHTML='<tr><td colspan="10" class="empty">暂无符合条件的知识条目</td></tr>';$('pager').innerHTML='';return;}$('tableBody').innerHTML=list.map(rowTpl).join('');$('tableBody').querySelectorAll('[data-action]').forEach(b=>b.onclick=onAction);renderPager(data.length)}
    function rowTpl(r){return `<tr><td class="check-col"><input class="row-check" type="checkbox"></td><td>${r.id}</td><td title="${esc(r.summary)}"><div class="main-text">${esc(r.title)}</div><div class="sub-text">${esc(r.summary)}</div></td><td>${esc(r.cat)}</td><td>${esc(r.source)}</td><td>${r.tags.map(t=>`<span class="tag tag-blue">${esc(t)}</span>`).join('')}</td><td><span class="tag ${tagMap[r.status]}">${r.status}</span></td><td>${r.updated}</td><td>${r.refs}</td><td><div class="table-action">${actions(r)}</div></td></tr>`}
    function actions(r){return `<button class="link-btn" data-action="detail" data-id="${r.id}">详情</button><button class="link-btn" data-action="similar" data-id="${r.id}">相似</button><button class="link-btn" data-action="refs" data-id="${r.id}">引用</button>${r.status==='待审核'?`<button class="link-btn danger" data-action="review" data-id="${r.id}">审核</button>`:`<button class="link-btn muted" data-action="edit" data-id="${r.id}">编辑</button>`}`}
    function renderPager(total){let pages=Math.max(1,Math.ceil(total/pageSize));if(page>pages)page=pages;let html=`<button class="page-arrow ${page===1?'disabled':''}" data-p="${page-1}">‹</button>`;for(let i=1;i<=pages;i++)html+=`<button class="page-btn ${i===page?'active':''}" data-p="${i}">${i}</button>`;html+=`<button class="page-arrow ${page===pages?'disabled':''}" data-p="${page+1}">›</button>`;$('pager').innerHTML=html;$('pager').querySelectorAll('button').forEach(b=>b.onclick=()=>{let p=Number(b.dataset.p);if(p>=1&&p<=pages){page=p;renderTable();}})}
    function onAction(e){let id=e.currentTarget.dataset.id,act=e.currentTarget.dataset.action;if(act==='detail'||act==='edit')openDetail(id);if(act==='similar')openSimilar(id);if(act==='refs')openRefs(id);if(act==='review')openReview(id)}
    function openEntry(){currentId='';$('entryTitle').textContent='新建';$('entryBody').innerHTML=entryForm();show('entryMask')}
    function entryForm(){return `<div class="form-grid"><div class="form-item"><label>知识标题<span class="req">*</span></label><input class="input" id="entryTitleInput" placeholder="请输入标题"></div><div class="form-item"><label>所属分类</label><select class="select" id="entryCat" style="width:100%">${categories.slice(1).map(c=>`<option>${c}</option>`).join('')}</select></div><div class="form-item"><label>文书类型</label><select class="select" id="entryType" style="width:100%">${types.map(t=>`<option>${t}</option>`).join('')}</select></div><div class="form-item"><label>适用阶段</label><select class="select" id="entryStage" style="width:100%">${stages.map(s=>`<option>${s}</option>`).join('')}</select></div><div class="form-item full"><label>标签</label><input class="input" id="entryTags" placeholder="案由、文书类型、法院层级、业务领域、适用阶段"></div><div class="form-item full"><label>正文</label><textarea class="textarea" id="entryBodyInput" placeholder="请输入正文、案由、适用场景"></textarea></div></div>`}
    function saveEntry(){let title=$('entryTitleInput')?.value.trim();if(!title)return toast('请填写知识标题');rows.unshift({id:`KB${Date.now().toString().slice(-11)}`,title,summary:$('entryBodyInput').value.slice(0,42)||'手动创建知识条目',cat:$('entryCat').value,type:$('entryType').value,source:'手动编辑',tags:($('entryTags').value||$('entryType').value).split(/[，,]/).map(x=>x.trim()).filter(Boolean),stage:$('entryStage').value,status:'待审核',refs:0,updated:now(),body:$('entryBodyInput').value});hide('entryMask');page=1;renderAll();toast('已提交入库审核')}
    function openReview(id){currentId=id;let r=row(id);$('reviewBody').innerHTML=block('知识材料',`${r.id} · ${r.title}<br>${r.summary}`)+block('审核要点','确认准确性、合规性和可复用性。');show('reviewMask')}
    function approve(ok){let r=row(currentId);r.status=ok?'已发布':'已退回';r.updated=now();hide('reviewMask');renderAll();toast(ok?'审核通过':'已退回修改')}
    function openManage(mode){manageMode=mode;$('manageTitle').textContent='分类新增';let body=categories.slice(1).map(c=>`<span class="tag tag-gray">${c}</span>`).join('');$('manageBody').innerHTML=block('当前项目',body)+`<div class="form-item"><label>新增分类</label><input class="input" id="manageInput" placeholder="请输入名称"></div>`;show('manageMask')}
    function saveManage(){let v=$('manageInput').value.trim();if(v&&manageMode==='category'&&!categories.includes(v))categories.push(v);hide('manageMask');renderAll();toast('新增项已保存')}
    function openDetail(id){let r=row(id);$('drawerTitle').textContent=r.title;$('drawerSub').textContent=`${r.cat} · ${r.type} · ${r.status}`;$('drawerBody').innerHTML=block('基础信息',`<div class="detail-grid">${kv('知识编号',r.id)+kv('入库方式',r.source)+kv('适用阶段',r.stage)+kv('引用次数',r.refs)+kv('最近更新',r.updated)+kv('审核状态',r.status)}</div>`)+block('标签',r.tags.map(t=>`<span class="tag tag-blue">${esc(t)}</span>`).join(''))+block('正文摘要',esc(r.body));$('drawer').classList.add('show')}
    function openSimilar(id){let r=row(id),list=rows.filter(x=>x.id!==id&&(x.cat===r.cat||x.tags.some(t=>r.tags.includes(t)))).slice(0,4);$('drawerTitle').textContent='相似文书检索';$('drawerSub').textContent=r.title;$('drawerBody').innerHTML=block('检索条件',`案由/分类：${r.cat}；标签：${r.tags.join('、')}`)+block('相似结果',list.map(x=>`<div class="kv"><div class="kv-value">${esc(x.title)}</div><div class="kv-label">${x.cat} · ${x.type} · 引用 ${x.refs} 次</div></div>`).join('')||'暂无相似文书');$('drawer').classList.add('show')}
    function openRefs(id){let r=row(id);$('drawerTitle').textContent='引用记录';$('drawerSub').textContent=r.title;$('drawerBody').innerHTML=block('引用概览',`累计引用 ${r.refs} 次`)+block('最近使用',`2026-06-17 14:20 · 沈律师 · 文书生成<br>2026-06-16 09:48 · 王律师 · 模板引用<br>2026-06-14 18:12 · 刘律师 · 相似案例检索`);$('drawer').classList.add('show')}
    function block(t,b){return `<div class="section"><div class="section-head">${t}</div><div class="section-body">${b}</div></div>`}
    function kv(k,v){return `<div class="kv"><div class="kv-label">${k}</div><div class="kv-value">${esc(v)}</div></div>`}
    function row(id){return rows.find(x=>x.id===id)||rows[0]}
    function now(){let d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`}
    function bindEvents(){$('btnAdd').onclick=openEntry;$('btnCategory').onclick=()=>openManage('category');$('btnSaveEntry').onclick=saveEntry;$('btnApprove').onclick=()=>approve(true);$('btnReject').onclick=()=>approve(false);$('btnSaveManage').onclick=saveManage;$('btnSearch').onclick=()=>{page=1;renderTable()};$('btnSimilar').onclick=()=>openSimilar(filteredRows()[0]?.id||rows[0].id);$('btnReset').onclick=resetFilters;$('treeKeyword').oninput=renderTree;$('keyword').oninput=()=>{page=1;renderTable()};['typeFilter','stageFilter','statusFilter'].forEach(id=>$(id).onchange=()=>{page=1;renderTable()});$('jumpInput').onkeydown=e=>{if(e.key==='Enter'){page=Math.max(1,Number(e.target.value||1));renderTable()}};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));document.querySelector('[data-close-drawer]').onclick=()=>$('drawer').classList.remove('show')}
    function resetFilters(){['keyword','typeFilter','stageFilter','statusFilter'].forEach(id=>$(id).value='');activeCat='全部';page=1;renderAll()}
    function show(id){$(id).classList.add('show')}function hide(id){$(id).classList.remove('show')}function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
    init();
  </script>
</body>
</html>
