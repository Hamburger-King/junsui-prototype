<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>劳动仲裁文书包审核 - 君穗律师工作台</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#1d2939;font:14px/1.55 Arial,"Microsoft YaHei",sans-serif}button{font:inherit;cursor:pointer}.top{height:64px;padding:0 28px;display:flex;align-items:center;justify-content:space-between;background:#fff;border-bottom:1px solid #e7ebf1}.brand{font-size:20px;font-weight:800}.brand b{margin-left:6px;padding:3px 6px;border-radius:6px;background:#8b6508;color:#fff;font-size:12px}.back{border:0;background:none;color:#246bfd}.layout{display:grid;grid-template-columns:292px minmax(0,1fr);min-height:calc(100vh - 64px)}.side{padding:22px 18px;background:#fff;border-right:1px solid #e7ebf1}.side h2{margin:0 0 4px;font-size:18px}.muted{color:#8491a5;font-size:12px}.status{display:inline-flex;margin:16px 0;padding:5px 10px;border-radius:99px;background:#fff3e8;color:#e66b14;font-size:12px}.doc-list{display:grid;gap:8px;margin-top:18px}.doc{width:100%;padding:12px;border:1px solid #e4e9f0;border-radius:10px;background:#fff;text-align:left;color:#344054}.doc.active{border-color:#9fc0ff;background:#f3f7ff;color:#175cd3}.doc small{display:block;margin-top:3px;color:#98a2b3}.main{padding:24px;min-width:0}.summary{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:16px;padding:20px 22px;border:1px solid #e2e7ef;border-radius:14px;background:#fff}.summary h1{margin:0 0 7px;font-size:22px}.meta{color:#7a8699;font-size:12px}.actions{display:flex;flex-wrap:wrap;gap:9px;justify-content:flex-end}.btn{height:38px;padding:0 16px;border:1px solid #d8dee8;border-radius:8px;background:#fff;color:#344054}.btn.primary{border-color:#246bfd;background:#246bfd;color:#fff}.btn.warn{border-color:#f79009;color:#c85d06}.workspace{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(280px,.7fr);gap:16px}.card{border:1px solid #e2e7ef;border-radius:14px;background:#fff;overflow:hidden}.card-head{padding:16px 18px;border-bottom:1px solid #edf0f4;font-size:15px;font-weight:700}.card-body{padding:18px}.report{padding:14px;border-radius:10px;background:#f3f7ff;color:#344c72}.answers{display:grid;gap:8px;margin-top:14px}.answer{padding:10px 12px;border:1px solid #edf0f4;border-radius:9px}.answer small{display:block;color:#98a2b3}.paper{min-height:520px;padding:34px 44px;color:#222;box-shadow:0 4px 18px rgba(30,45,70,.06)}.paper h2{text-align:center}.paper p{text-indent:2em;line-height:2}.timeline{display:grid;gap:12px}.timeline div{position:relative;padding-left:19px;color:#667085}.timeline div:before{content:"";position:absolute;left:0;top:6px;width:8px;height:8px;border-radius:50%;background:#246bfd}.mask{position:fixed;inset:0;z-index:20;display:none;place-items:center;background:rgba(15,23,42,.42)}.mask.show{display:grid}.modal{width:min(540px,calc(100vw - 32px));padding:22px;border-radius:14px;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.2)}.modal h3{margin:0 0 8px}.modal textarea,.modal input{width:100%;margin-top:10px;padding:11px;border:1px solid #d8dee8;border-radius:8px;outline:none}.modal textarea{min-height:100px;resize:vertical}.modal-foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;left:50%;bottom:28px;z-index:40;transform:translateX(-50%) translateY(20px);padding:10px 18px;border-radius:8px;background:#172b4d;color:#fff;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%)}@media(max-width:900px){.layout{grid-template-columns:1fr}.side{display:none}.workspace{grid-template-columns:1fr}.summary{display:block}.actions{justify-content:flex-start;margin-top:15px}.paper{padding:24px}}
  </style>
</head>
<body>
  <header class="top"><div class="brand">君穗 <b>律师工作台</b></div><button class="back" onclick="location.href='./my-todos.html'">← 返回我的待办</button></header>
  <div class="layout">
    <aside class="side"><h2>文书包审核</h2><div class="muted" id="sideCase"></div><span class="status" id="sideStatus">系统初稿待审</span><div class="doc-list" id="docList"></div></aside>
    <main class="main">
      <section class="summary"><div><h1>劳动仲裁文书包</h1><div class="meta" id="meta"></div></div><div class="actions"><button class="btn warn" id="supplementBtn">要求用户补充材料</button><button class="btn" id="downloadBtn">下载当前 Word</button><button class="btn" id="uploadBtn">上传律师修改版</button><button class="btn primary" id="approveBtn">审核通过并交付</button></div></section>
      <div class="workspace"><div class="card"><div class="card-head" id="paperTitle">劳动仲裁申请书 · AI 初稿</div><article class="paper" id="paper"></article></div><aside><section class="card"><div class="card-head">AI 案件摘要</div><div class="card-body"><div class="report" id="report"></div><div class="answers" id="answers"></div></div></section><section class="card" style="margin-top:16px"><div class="card-head">办理记录</div><div class="card-body timeline" id="timeline"></div></section></aside></div>
    </main>
  </div>
  <div class="mask" id="supplementMask"><section class="modal"><h3>要求用户补充材料</h3><p class="muted">发送后，任务进入“等待用户”，用户端菜单显示红色待办数量。</p><textarea id="supplementText" placeholder="每行一项，例如：劳动合同或入职证明&#10;近12个月工资流水&#10;解除或辞退通知"></textarea><input id="supplementDeadline" type="datetime-local" value="2026-08-22T18:00"><div class="modal-foot"><button class="btn" data-close>取消</button><button class="btn primary" id="sendSupplement">发送补充清单</button></div></section></div>
  <div class="mask" id="uploadMask"><section class="modal"><h3>上传律师修改版</h3><p class="muted">请先下载系统 Word，在本地修改后上传为新版本。</p><input id="versionFile" type="file" accept=".doc,.docx"><textarea id="versionNote" placeholder="本次修改说明（选填）"></textarea><div class="modal-foot"><button class="btn" data-close>取消</button><button class="btn primary" id="confirmUpload">上传新版本</button></div></section></div>
  <div class="mask" id="approveMask"><section class="modal"><h3>确认审核并交付？</h3><p>交付后用户可在“文书任务”中下载全部定稿文件，该待办移入“已完成”。</p><div class="modal-foot"><button class="btn" data-close>取消</button><button class="btn primary" id="confirmApprove">确认交付</button></div></section></div>
  <div class="toast" id="toast"></div>
  <script>
    const $=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    const fallback={orderId:'DD2026081801',caseNo:'AJ2026081801',todoId:'DB2026081801',cause:'劳动争议与人事争议纠纷',question:'公司拖欠工资并违法辞退，我该怎么办？',answers:['是，我与公司因工作产生纠纷','已被辞退或解除','主张经济补偿金或赔偿金','已协商，准备申请劳动仲裁'],services:['劳动仲裁文书包'],documents:['沟通函.docx','被迫解除劳动关系通知书.docx','劳动仲裁申请书.docx','证据清单.xlsx','送达地址确认书.docx'],amount:39,status:'待律师审核',adminStatus:'待我处理',stage:'AI初稿已生成',version:1,createdAt:'2026/8/18 10:30:00',analysis:'劳动争议一般应先申请劳动仲裁；建议固定劳动关系、工资社保、考勤及解除沟通证据。',supplementItems:[],deliveryFiles:[]};
    let order;try{order=JSON.parse(localStorage.getItem('junsuiLaborOrder')||'null')||fallback}catch(e){order=fallback}let activeDoc=2;
    const questions=['案由确认','劳动关系状态','核心诉求','当前阶段'];
    function save(){localStorage.setItem('junsuiLaborOrder',JSON.stringify(order))}function now(){return new Date().toLocaleString('zh-CN',{hour12:false})}function notice(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1800)}
    function paperHtml(){const doc=(order.documents||[])[activeDoc]||'案件分析报告';return `<h2>${esc(doc.replace(/\.(docx?|xlsx)$/i,''))}</h2><p>申请人：本案劳动者。被申请人：相关用人单位。</p><p><strong>仲裁请求：</strong>请求依法支付拖欠工资、经济补偿或赔偿，并承担依法应付的其他款项，具体金额由律师结合工资流水及工作年限核定。</p><p><strong>事实与理由：</strong>${esc(order.question)}。申请人与被申请人存在劳动关系，争议涉及工资、社会保险及劳动关系解除。现依法申请劳动仲裁，请予支持。</p><p>附件：证据清单及相关证明材料。</p>`}
    function render(){const status=order.adminStatus==='已完成'?'已审核交付':order.adminStatus==='等待用户'?'等待用户补充':order.stage||'系统初稿待审';$('sideCase').textContent=`${order.caseNo} · ${order.orderId}`;$('sideStatus').textContent=status;$('meta').textContent=`客户：满萃金奖深烘冰美式　·　订单：${order.orderId}　·　版本：V${order.version||1}`;$('docList').innerHTML=(order.documents||['案件分析报告']).map((d,i)=>`<button class="doc ${i===activeDoc?'active':''}" data-i="${i}">${esc(d)}<small>${order.version>1?'律师修改版':'AI 生成初稿'}</small></button>`).join('');$('docList').querySelectorAll('.doc').forEach(b=>b.onclick=()=>{activeDoc=Number(b.dataset.i);render()});$('paperTitle').textContent=`${(order.documents||[])[activeDoc]||'案件分析报告'} · V${order.version||1}`;$('paper').innerHTML=paperHtml();$('report').innerHTML=`<strong>${esc(order.cause)}</strong><br>${esc(order.analysis)}`;$('answers').innerHTML=(order.answers||[]).map((a,i)=>`<div class="answer"><small>${questions[i]||`信息 ${i+1}`}</small>${esc(a)}</div>`).join('');const logs=[`${order.createdAt}　用户支付成功，AI 内容进入律师工作台。`];if(order.version>1)logs.unshift(`${order.modifiedAt||now()}　律师上传修改版 V${order.version}。`);if(order.supplementItems?.length)logs.unshift(`${order.supplementAt||now()}　已要求用户补充 ${order.supplementItems.length} 项材料。`);if(order.deliveredAt)logs.unshift(`${order.deliveredAt}　律师审核完成，文书已交付用户。`);$('timeline').innerHTML=logs.map(x=>`<div>${esc(x)}</div>`).join('');const locked=order.adminStatus==='已完成',waiting=order.adminStatus==='等待用户';$('approveBtn').disabled=locked||waiting;$('supplementBtn').disabled=locked;$('uploadBtn').disabled=locked;$('approveBtn').title=waiting?'等待用户补充完成后才可交付':'';}
    function download(name){const blob=new Blob([`君穗律师审核文书\n案件编号：${order.caseNo}\n文书：${name}\n版本：V${order.version||1}`],{type:'application/msword'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);notice('文书已下载')}
    $('downloadBtn').onclick=()=>download((order.documents||[])[activeDoc]||'案件分析报告.docx');$('supplementBtn').onclick=()=>{$('supplementMask').classList.add('show')};$('uploadBtn').onclick=()=>{$('uploadMask').classList.add('show')};$('approveBtn').onclick=()=>{$('approveMask').classList.add('show')};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>b.closest('.mask').classList.remove('show'));
    $('sendSupplement').onclick=()=>{const items=$('supplementText').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!items.length)return notice('请至少填写一项材料');order.supplementItems=items.map(name=>({name,status:'待用户补充',files:[]}));order.deadline=$('supplementDeadline').value.replace('T',' ');order.status='等待用户补充';order.adminStatus='等待用户';order.stage=`等待用户补充 ${items.length} 项材料`;order.supplementAt=now();save();$('supplementMask').classList.remove('show');render();notice('补充清单已同步给用户')};
    $('confirmUpload').onclick=()=>{const file=$('versionFile').files[0];if(!file)return notice('请选择修改后的 Word 文件');order.version=(order.version||1)+1;order.modifiedFile=file.name;order.modifiedNote=$('versionNote').value.trim();order.modifiedAt=now();order.stage=`律师修改版 V${order.version} 待复核`;order.adminStatus='待我处理';save();$('uploadMask').classList.remove('show');render();notice(`已上传 V${order.version} 修改版`)};
    $('confirmApprove').onclick=()=>{order.status='已交付';order.adminStatus='已完成';order.stage='律师审核完成';order.deliveredAt=now();order.deliveryFiles=(order.documents||[]).map(name=>({name:name.replace(/\.(docx?|xlsx)$/i,'_定稿.$1'),version:order.version||1}));save();$('approveMask').classList.remove('show');render();notice('文书已交付用户，待办已完成')};render();
  </script>
</body>
</html>
