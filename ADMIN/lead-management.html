    function filteredRows(){let k=$('keyword').value.trim().toLowerCase(),start=$('startDate').value,end=$('endDate').value,min=$('scoreFilter').value;return leads.filter(r=>{let hay=`${r.name} ${r.phone} ${r.wechat} ${r.reason} ${r.summary}`.toLowerCase();if(activeTab!=='全部'&&r.status!==activeTab)return false;if(k&&!hay.includes(k))return false;if($('sourceFilter').value&&r.source!==$('sourceFilter').value)return false;if($('reasonFilter').value&&r.reason!==$('reasonFilter').value)return false;if($('regionFilter').value&&r.region!==$('regionFilter').value)return false;if($('statusFilter').value&&r.status!==$('statusFilter').value)return false;if(min==='80'&&r.score<80)return false;if(min==='60'&&(r.score<60||r.score>=80))return false;if(min==='0'&&r.score>=60)return false;if(start&&r.createdAt.slice(0,10)<start)return false;if(end&&r.createdAt.slice(0,10)>end)return false;return true;});}
    function renderAll(){renderMetrics();renderTable();}
    function renderTabs(){$('tabs').innerHTML=tabs.map(t=>`<button class="lead-tab ${t===activeTab?'active':''}" data-tab="${t}">${t}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;page=1;renderTabs();renderAll();});}
    function renderMetrics(){let total=leads.length,dup=leads.filter(r=>r.duplicate).length,un=leads.filter(r=>r.status==='待分配').length,high=leads.filter(r=>r.score>=80).length,due=leads.filter(r=>r.status==='待跟进'||r.status==='跟进中').length;let data=[['线索总量',total,'今日新增 2'],['待分配',un,'需运营处理'],['重复风险',dup,'手机号/微信号/设备'],['高分线索',high,'80分以上'],['跟进中',due,'含待提醒']];$('metrics').innerHTML=data.map(i=>`<div class="metric"><div class="metric-label">${i[0]}</div><div class="metric-value">${i[1]}<span class="metric-note">${i[2]}</span></div></div>`).join('');}
    function renderHead(){$('tableHead').innerHTML='<tr><th class="check-col"><input type="checkbox" id="checkAll"/></th><th class="id-col">线索编号</th><th class="client-col">客户信息</th><th class="source-col">来源 / 案由</th><th class="region-col">地区</th><th class="status-col">状态</th><th class="score-col">评分</th><th class="time-col">创建时间</th><th class="time-col">下次跟进</th><th class="owner-col">负责人</th><th class="op-col">操作</th></tr>';}
    function renderTable(){renderHead();let data=filteredRows(),rows=data.slice((page-1)*pageSize,page*pageSize);$('totalText').textContent=`共 ${data.length} 条`;$('jumpInput').value=page;if(!rows.length){$('tableBody').innerHTML='<tr><td colspan="11" class="empty">暂无符合条件的线索</td></tr>';$('pager').innerHTML='';return;}$('tableBody').innerHTML=rows.map(rowTpl).join('');$('tableBody').querySelectorAll('[data-action]').forEach(b=>b.onclick=onAction);renderPager(data.length);}
    function rowTpl(r){return `<tr><td class="check-col"><input class="row-check" type="checkbox"/></td><td title="${r.id}">${r.id}</td><td><div class="client-main">${esc(r.name)}</div><div class="client-sub">${esc(r.phone)} / ${esc(r.wechat)}</div></td><td><div>${esc(r.source)}</div><div class="client-sub">${esc(r.reason)}</div></td><td>${esc(r.region)}</td><td><span class="tag ${tagMap[r.status]}">${esc(r.status)}</span></td><td><div class="score"><span>${r.score}</span><span class="score-track"><span class="score-fill" style="width:${r.score}%"></span></span></div></td><td>${esc(r.createdAt)}</td><td>${esc(r.nextFollow)}</td><td>${esc(r.owner)}</td><td><div class="table-action">${actions(r)}</div></td></tr>`;}
    function actions(r){return `<button class="link-btn" data-action="detail" data-id="${r.id}">详情</button><button class="link-btn ${r.duplicate?'danger':'muted'}" data-action="dup" data-id="${r.id}">去重</button><button class="link-btn" data-action="assign" data-id="${r.id}">分配</button><button class="link-btn" data-action="remind" data-id="${r.id}">提醒</button><button class="link-btn" data-action="log" data-id="${r.id}">日志</button><button class="link-btn" data-action="case" data-id="${r.id}">转案件</button>`;}
    function renderPager(total){let pages=Math.max(1,Math.ceil(total/pageSize));if(page>pages)page=pages;let html=`<button class="page-arrow ${page===1?'disabled':''}" data-p="${page-1}">‹</button>`;for(let i=1;i<=pages;i++)html+=`<button class="page-btn ${i===page?'active':''}" data-p="${i}">${i}</button>`;html+=`<button class="page-arrow ${page===pages?'disabled':''}" data-p="${page+1}">›</button>`;$('pager').innerHTML=html;$('pager').querySelectorAll('button').forEach(b=>b.onclick=()=>{let p=Number(b.dataset.p);if(p>=1&&p<=pages){page=p;renderTable();}});}
    function onAction(e){let id=e.currentTarget.dataset.id,act=e.currentTarget.dataset.action;if(act==='detail')openDetail(id);if(act==='dup')openDup(id);if(act==='assign')openAssign(id,false);if(act==='remind')openRemind(id);if(act==='log')openLog(id);if(act==='case')goCase(id);}
    function goCase(id){let r=lead(id),p=new URLSearchParams({from:'lead',leadId:r.id,name:r.name,phone:r.phone,reason:r.reason,region:r.region,amount:r.amount,summary:r.summary});location.href=`case-lifecycle-management.html?${p.toString()}`;}
    function lead(id){return leads.find(r=>r.id===id)||leads[0];}
    function block(title,body){return `<div class="section" style="margin-bottom:14px"><div class="section-head">${title}</div><div class="section-body">${body}</div></div>`;}
    function openDetail(id){let r=lead(id);$('drawerTitle').textContent=`${r.name} / ${r.id}`;$('drawerSub').textContent=`${r.source} · ${r.reason} · ${r.region}`;$('drawerBody').innerHTML=detailHtml(r);$('drawer').classList.add('show');}
    function detailHtml(r){let profile=`<div class="detail-grid">${kv('手机号',r.phone)+kv('微信号',r.wechat)+kv('设备',r.device)+kv('线索类型',r.type)+kv('涉案金额',r.amount)+kv('客户意向',r.intent)}</div>`;let files=r.materials.map(m=>`<span class="tag tag-gray" style="margin:0 8px 8px 0">${esc(m)}</span>`).join('');let trail=r.trail.map(t=>`<div class="time-item">${esc(t)}</div>`).join('');return block('用户资料',profile)+block('咨询记录',esc(r.consult))+block('AI 摘要',esc(r.summary))+block('上传材料',files||'暂无材料')+block('互动轨迹',`<div class="timeline">${trail}</div>`);}
    function kv(k,v){return `<div class="kv"><div class="kv-label">${k}</div><div class="kv-value">${esc(v)}</div></div>`;}
    function openDup(id){let r=lead(id),same=leads.filter(x=>x.id!==id&&(x.phone===r.phone||x.wechat===r.wechat||x.device===r.device||x.reason===r.reason&&x.region===r.region));$('dupBody').innerHTML=`<div class="panel-sub" style="margin-bottom:12px">按手机号、微信号、设备、案情相似度识别重复线索。</div><table><thead><tr><th>线索编号</th><th>客户</th><th>手机号</th><th>微信号</th><th>设备</th><th>案由/地区</th><th>相似度</th></tr></thead><tbody>${same.map(x=>`<tr><td>${x.id}</td><td>${x.name}</td><td>${x.phone}</td><td>${x.wechat}</td><td>${x.device}</td><td>${x.reason} / ${x.region}</td><td>${x.phone===r.phone?'98%':'76%'}</td></tr>`).join('')||'<tr><td colspan="7" class="empty">未发现重复线索</td></tr>'}</tbody></table>`;currentId=id;show('dupMask');}
    function openScore(){let rows=Object.entries(scoreRules).map(([k,v])=>{let name={amount:'涉案金额',urgency:'紧急度',reason:'案由',region:'地区',material:'材料完整度'}[k];return `<div class="range-row"><label>${name}</label><input type="range" min="0" max="60" value="${v}" data-rule="${k}"><strong data-value="${k}">${v}%</strong></div>`;}).join('');$('scoreBody').innerHTML=`<div class="panel-sub" style="margin-bottom:14px">配置金额、紧急度、案由、地区、材料完整度等评分权重，合计建议保持 100%。</div>${rows}<div class="section"><div class="section-body">当前权重合计：<b id="scoreTotal">100%</b></div></div>`;$('scoreBody').querySelectorAll('[data-rule]').forEach(i=>i.oninput=updateScore);show('scoreMask');}
    function updateScore(e){let k=e.target.dataset.rule;scoreRules[k]=Number(e.target.value);document.querySelector(`[data-value="${k}"]`).textContent=`${scoreRules[k]}%`;let sum=Object.values(scoreRules).reduce((a,b)=>a+b,0);$('scoreTotal').textContent=`${sum}%`;$('scoreTotal').style.color=sum===100?'var(--success)':'var(--danger)';}
    function openAssign(id,auto){let r=lead(id),rec=suggest(r);currentId=id;selectedAssignee=auto?rec:'';$('assignTitle').textContent=auto?'自动分配规则':'手动分配线索';$('assignBody').innerHTML=`<div class="section"><div class="section-head">线索信息</div><div class="section-body">${r.name} · ${r.reason} · ${r.region} · ${r.score}分</div></div><div class="form-item" style="margin-top:14px"><label>选择负责人</label><select class="select" id="assigneeSelect" style="width:100%;height:36px">${lawyers.map(x=>`<option ${x===selectedAssignee?'selected':''}>${x}</option>`).join('')}</select></div><div class="section" style="margin-top:14px"><div class="section-head">自动分配依据</div><div class="section-body">按律师专业方向、地区、当前负载和线索类型计算，推荐：<b>${rec}</b></div></div>`;$('assigneeSelect').onchange=e=>selectedAssignee=e.target.value;if(!selectedAssignee)selectedAssignee=$('assigneeSelect').value;show('assignMask');}
    function suggest(r){return lawyers.find(x=>x.includes(r.reason)||x.includes(r.region))||lawyers[0];}
    function openRemind(id){let r=lead(id);currentId=id;$('remindBody').innerHTML=`<div class="form-item"><label>下次跟进时间</label><input class="input" type="datetime-local" id="nextFollowInput" style="height:36px" value="${r.nextFollow.replace(' ','T')}"></div><div class="panel-sub" style="margin-top:10px">到期后提醒负责人处理。</div>`;show('remindMask');}
    function openLog(id){let r=lead(id);currentId=id;let logs=r.logs.map(x=>`<div class="time-item"><b>${x[0]} · ${x[1]}</b><br>${esc(x[2])}<br>客户意向：${x[3]}；下一步：${x[4]}</div>`).join('')||'<div class="empty">暂无跟进日志</div>';$('logBody').innerHTML=block('历史日志',`<div class="timeline">${logs}</div>`)+`<div class="form-grid"><div class="form-item"><label>联系时间</label><input class="input" id="logTime" value="${now()}"></div><div class="form-item"><label>联系方式</label><select class="select" id="logMethod" style="width:100%"><option>电话</option><option>微信</option><option>短信</option><option>面谈</option></select></div><div class="form-item full"><label>沟通摘要</label><textarea class="textarea" id="logSummary" placeholder="记录本次沟通重点"></textarea></div><div class="form-item"><label>客户意向</label><select class="select" id="logIntent" style="width:100%"><option>强</option><option>中</option><option>弱</option></select></div><div class="form-item"><label>下一步计划</label><input class="input" id="logNext" placeholder="例如：安排律师回访"></div></div>`;show('logMask');}
    function now(){let d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
    function bindEvents(){$('btnScore').onclick=openScore;$('btnAutoRule').onclick=()=>openAssign(leads.find(x=>x.status==='待分配')?.id||leads[0].id,true);$('btnAdd').onclick=()=>toast('已保留新建线索入口，可继续扩展录入表单');$('btnSearch').onclick=()=>{page=1;renderAll();};$('btnReset').onclick=resetFilters;$('btnMerge').onclick=()=>{lead(currentId).duplicate=false;lead(currentId).status='待跟进';hide('dupMask');renderAll();toast('已标记重复线索处理完成');};$('btnSaveScore').onclick=()=>{hide('scoreMask');toast('评分规则已保存');};$('btnSaveAssign').onclick=saveAssign;$('btnSaveRemind').onclick=saveRemind;$('btnSaveLog').onclick=saveLog;$('jumpInput').onkeydown=e=>{if(e.key==='Enter'){page=Math.max(1,Number(e.target.value||1));renderTable();}};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));document.querySelector('[data-close-drawer]').onclick=()=>$('drawer').classList.remove('show');['keyword','sourceFilter','reasonFilter','regionFilter','statusFilter','scoreFilter','startDate','endDate'].forEach(id=>$(id).onchange=()=>{page=1;renderAll();});$('keyword').oninput=()=>{page=1;renderAll();};}
    function resetFilters(){['keyword','sourceFilter','reasonFilter','regionFilter','statusFilter','scoreFilter','startDate','endDate'].forEach(id=>$(id).value='');page=1;renderAll();}
    function saveAssign(){let r=lead(currentId),v=$('assigneeSelect').value;r.owner=v.split(' / ')[0];r.status='已分配';hide('assignMask');renderAll();toast('线索已分配');}
    function saveRemind(){lead(currentId).nextFollow=$('nextFollowInput').value.replace('T',' ');hide('remindMask');renderAll();toast('跟进提醒已更新');}
    function saveLog(){let r=lead(currentId),summary=$('logSummary').value.trim();if(!summary){toast('请填写沟通摘要');return;}r.logs.unshift([$('logTime').value,$('logMethod').value,summary,$('logIntent').value,$('logNext').value||'待确认']);r.status='跟进中';hide('logMask');renderAll();toast('跟进日志已新增');}
    function show(id){$(id).classList.add('show')}function hide(id){$(id).classList.remove('show')}function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
    init();
  </script>
</body>
</html>
