px solid var(--line);border-radius:8px;display:flex;align-items:center}.file-icon{width:34px;height:34px;margin-right:10px;border-radius:7px;background:#e8f3ff;color:var(--blue);display:flex;align-items:center;justify-content:center;font-size:11px}.file-copy{min-width:0;flex:1}.file-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.file-size{margin-top:3px;color:var(--muted);font-size:11px}.preview{color:var(--primary-dark);font-size:12px}.user-note{padding:13px;border-radius:7px;background:#f7f8fa;color:var(--text2);line-height:1.7}.waiting{padding:48px 20px;text-align:center;color:var(--muted)}.waiting strong{display:block;margin-bottom:8px;color:var(--text);font-size:16px}.review-foot{padding:13px 20px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}.foot-tip{color:var(--muted);font-size:12px}.foot-actions{display:flex;gap:9px}
    .mask{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;background:rgba(29,33,41,.38)}.mask.show{display:flex}.modal{width:560px;border-radius:10px;background:#fff;box-shadow:0 22px 55px rgba(0,0,0,.18);overflow:hidden}.modal-head{height:58px;padding:0 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;font-size:16px;font-weight:700}.close{width:30px;height:30px;border:0;background:none;font-size:22px;color:var(--muted);cursor:pointer}.modal-body{padding:18px 20px}.form-item{margin-bottom:15px}.form-item label{display:block;margin-bottom:7px;color:var(--text2);font-size:13px}.req{color:var(--red)}.form-control{width:100%;height:38px;padding:0 11px;border:1px solid var(--line);border-radius:6px;outline:none}.form-textarea{width:100%;min-height:96px;padding:10px 11px;border:1px solid var(--line);border-radius:6px;resize:vertical;outline:none}.reference-upload{height:42px;border:1px dashed #d9c5a5;border-radius:7px;background:#fffaf2;color:var(--primary-dark);display:flex;align-items:center;justify-content:center;cursor:pointer}.reference-upload:hover{background:#fbf3e6}.reference-upload-tip{margin-top:6px;color:var(--muted);font-size:11px}.pending-reference-list{margin-top:8px}.pending-reference-item{display:flex;align-items:center;gap:8px;height:36px;padding:0 9px;margin-top:6px;border:1px solid var(--line);border-radius:6px}.pending-reference-item span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:12px}.pending-reference-item button{border:0;background:none;color:var(--red);cursor:pointer;font-size:12px}.modal-foot{padding:13px 20px 18px;display:flex;justify-content:flex-end;gap:9px}.toast{position:fixed;left:50%;bottom:28px;z-index:40;transform:translate(-50%,12px);padding:10px 16px;border-radius:6px;background:#1d2129;color:#fff;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}

<body>
  <main class="page" id="listPage"><section class="shell">
    <header class="head"><div><div class="title">我的待办</div><div class="sub">集中处理分配给我的案件、文书及客户材料审核任务。</div></div><button class="btn" id="refreshBtn">刷新待办</button></header>
    <section class="metrics" id="metrics"></section><nav class="tabs" id="tabs"></nav>
    <div class="toolbar"><input class="input" id="keyword" placeholder="搜索待办、案件编号或客户名称"><select class="select" id="typeFilter"><option value="">全部类型</option><option>补充材料审核</option><option>文书定稿审批</option><option>文书上传交付</option><option>案件节点待办</option></select><div class="toolbar-tip">仅展示当前账号“刘律师”的待办任务</div></div>
    <div class="table-wrap"><table><thead><tr><th style="width:32%">待办事项</th><th style="width:18%">关联案件 / 客户</th><th style="width:14%">任务类型</th><th style="width:12%">提交进度</th><th style="width:12%">截止时间</th><th style="width:12%">操作</th></tr></thead><tbody id="todoBody"></tbody></table></div>
  </section></main>
  <section class="review-page" id="reviewPage"><div class="review-shell">
    <header class="review-head"><div class="crumb"><button class="btn-link" id="backBtn">← 返回我的待办</button>　/　<span id="reviewId"></span></div><div class="review-head-row"><div><div class="review-title" id="reviewTitle"></div><div class="review-meta" id="reviewMeta"></div></div><div class="review-summary"><div class="summary-item"><div class="summary-label">待办状态</div><div class="summary-value" id="reviewStatus"></div></div><div class="summary-item"><div class="summary-label">处理截止</div><div class="summary-value" id="reviewDeadline"></div></div><button class="btn" id="addRequirement">+ 新增补充项</button></div></div></header>
    <div class="review-layout"><aside class="review-nav"><div class="review-nav-head"><div class="review-nav-title">材料审核清单</div><div class="review-nav-sub" id="navSummary"></div><div class="progress"><span id="reviewProgress"></span></div></div><div class="nav-list" id="navList"></div></aside><div class="review-main-wrap"><main class="review-main" id="reviewMain"></main></div></div>
  </div></section>
  <div class="mask" id="returnMask"><section class="modal"><header class="modal-head">退回补充<button class="close" data-close="returnMask">×</button></header><div class="modal-body"><div class="form-item"><label>退回原因 <span class="req">*</span></label><textarea class="form-textarea" id="returnReason" placeholder="请明确说明材料存在的问题以及用户需要如何修改"></textarea></div><div class="form-item"><label>重新提交截止时间</label><input class="form-control" id="returnDeadline" value="2026-08-20 18:00"></div></div><footer class="modal-foot"><button class="btn" data-close="returnMask">取消</button><button class="btn btn-danger" id="confirmReturn">确认退回用户补充</button></footer></section></div>
  <div class="mask" id="addMask"><section class="modal"><header class="modal-head">新增用户补充项<button class="close" data-close="addMask">×</button></header><div class="modal-body"><div class="form-item"><label>补充项名称 <span class="req">*</span></label><input class="form-control" id="requirementName" placeholder="例如：银行转账回单"></div><div class="form-item"><label>律师说明 <span class="req">*</span></label><textarea class="form-textarea" id="requirementDesc" placeholder="说明需要用户提供什么、材料范围及清晰度要求"></textarea></div><div class="form-item"><label>参考图片或附件（选填）</label><label class="reference-upload" for="requirementFiles">＋ 上传示例、模板或情况说明<input id="requirementFiles" type="file" multiple hidden accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png"></label><div class="reference-upload-tip">用户侧可预览和下载，不计入用户需提交的材料数量</div><div class="pending-reference-list" id="pendingReferenceList"></div></div><div class="form-item"><label>提交截止时间</label><input class="form-control" id="requirementDeadline" value="2026-08-20 18:00"></div></div><footer class="modal-foot"><button class="btn" data-close="addMask">取消</button><button class="btn btn-primary" id="confirmAdd">发送给用户</button></footer></section></div>

  <script>

    let active='待我处理',current=null,currentIndex=2,pendingRequirementFiles=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));

    function render(){renderMetrics();renderTabs();renderTable();notify()}
    function renderMetrics(){let p=pendingCount(),material=todos.filter(x=>x.type==='补充材料审核'&&x.status!=='已完成').length,doc=todos.filter(x=>['文书定稿审批','文书上传交付'].includes(x.type)&&x.status!=='已完成').length,due=todos.filter(x=>x.status!=='已完成'&&x.deadline.slice(0,10)<='2026-08-19').length;$('metrics').innerHTML=[['待我处理',p,'项'],['材料审核',material,'项'],['文书任务',doc,'项'],['临期任务',due,'项需关注']].map(x=>`<div class="metric"><div class="metric-label">${x[0]}</div><div class="metric-value">${x[1]}<span class="metric-note">${x[2]}</span></div></div>`).join('')}
    function tabCount(x){if(x==='全部')return todos.length;if(x==='我发起的')return todos.filter(t=>t.type==='补充材料审核'&&t.status!=='已完成').length;return todos.filter(t=>t.status===x).length}
    function renderTabs(){$('tabs').innerHTML=['全部','待我处理','我发起的','处理中','已完成'].map(x=>`<button class="tab ${active===x?'active':''}" data-tab="${x}">${x}<span class="count">${tabCount(x)}</span></button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{active=b.dataset.tab;renderTabs();renderTable()})}
    function renderTable(){let k=$('keyword').value.trim().toLowerCase(),type=$('typeFilter').value,rows=todos.filter(t=>(active==='全部'||active==='我发起的'&&t.type==='补充材料审核'&&t.status!=='已完成'||t.status===active)&&(!type||t.type===type)&&(!k||`${t.title} ${t.caseNo} ${t.client}`.toLowerCase().includes(k)));$('todoBody').innerHTML=rows.length?rows.map(t=>`<tr><td><div class="todo-main">${esc(t.title)}</div><div class="todo-sub">${t.id} · 指派给：刘律师${t.status==='等待用户'?' · 等待用户补充':''}</div></td><td><div>${esc(t.caseNo)}</div><div class="todo-sub">${esc(t.client)}</div></td><td>${esc(t.type)}</td><td>${progressText(t)}</td><td>${esc(t.deadline)}</td><td><div class="op"><button class="btn-link" data-open="${t.id}">${t.status==='已完成'?'查看':'去处理'}</button></div></td></tr>`).join(''):'<tr><td colspan="6" class="empty">暂无符合条件的待办</td></tr>';$('todoBody').querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openReview(b.dataset.open))}
    function progressText(t){if(t.items){let done=t.items.filter(x=>x.status==='已通过').length;return `${done}/${t.items.length} 已通过`}return esc(t.progress||'-')}
    function openReview(id){current=todos.find(x=>x.id===id);if(!current.items){if(current.type==='文书定稿审批'){location.href=`./document-approval.html?todo=${encodeURIComponent(id)}`;return}if(current.type==='文书上传交付'){location.href=`./document-upload.html?todo=${encodeURIComponent(id)}`;return}toast('该待办将进入对应案件节点');return}currentIndex=Math.max(0,current.items.findIndex(x=>x.status==='已提交'||x.status==='无法提供待确认'));$('listPage').classList.add('hide');$('reviewPage').classList.add('show');renderReview()}
    function renderReview(){let done=current.items.filter(x=>['已通过','已豁免'].includes(x.status)).length,pendingReview=current.items.filter(x=>['已提交','无法提供待确认'].includes(x.status)).length;$('reviewId').textContent=current.id;$('reviewTitle').textContent='民事起诉状（货款纠纷）';$('reviewMeta').textContent=`关联案件：${current.caseNo}　·　客户：${current.client}　·　承办律师：刘律师`;$('reviewStatus').innerHTML=`<span class="tag ${current.status==='已完成'?'tag-green':'tag-orange'}">${current.status}</span>`;$('reviewDeadline').textContent=current.deadline;$('navSummary').textContent=`已通过/豁免 ${done} 项，待审核 ${pendingReview} 项`;$('reviewProgress').style.width=`${Math.round(done/current.items.length*100)}%`;$('navList').innerHTML=current.items.map((x,i)=>`<button class="nav-item ${i===currentIndex?'active':''}" data-index="${i}"><span class="nav-no ${['已通过','已豁免'].includes(x.status)?'pass':['已提交','无法提供待确认'].includes(x.status)?'review':'pending'}">${['已通过','已豁免'].includes(x.status)?'✓':i+1}</span><span class="nav-copy"><span class="nav-name">${esc(x.name)}</span><span class="nav-state">${esc(x.status)}${x.files.length?` · ${x.files.length} 个文件`:''}</span></span></button>`).join('');$('navList').querySelectorAll('button').forEach(b=>b.onclick=()=>{currentIndex=Number(b.dataset.index);renderReview()});renderCurrent()}
    function renderCurrent(){
      let item=current.items[currentIndex],canReview=item.status==='已提交',canExempt=item.status==='无法提供待确认';
      let material=canExempt?`<section class="card"><div class="card-title">用户申请无法提供</div><div class="user-note">${esc(item.note)}</div></section>`:item.files.length?`<section class="card"><div class="card-title">用户提交材料 <small>${item.files.length} 个文件</small></div>${item.files.map(f=>`<div class="file"><div class="file-icon">文件</div><div class="file-copy"><div class="file-name">${esc(f[0])}</div><div class="file-size">${esc(f[1])} · 已完成安全扫描</div></div><button class="btn-link preview-file">预览</button></div>`).join('')}</section><section class="card"><div class="card-title">用户补充说明</div><div class="user-note">${esc(item.note||'用户未填写补充说明')}</div></section>`:`<section class="card waiting"><strong>等待用户补充材料</strong>该补充项已发送至用户侧“文书任务”，用户提交后会自动进入你的待办。</section>`;
      if(item.reviewFeedback)material+=`<section class="card"><div class="card-title">上次退回记录</div><div class="user-note">${esc(item.reviewFeedback)}<br>重新提交截止：${esc(item.itemDeadline||current.deadline)}</div></section>`;
      let actions=canReview?'<button class="btn btn-danger" id="returnBtn">退回补充</button><button class="btn btn-primary" id="passBtn">确认通过并审核下一项</button>':canExempt?'<button class="btn btn-danger" id="continueBtn">继续要求补充</button><button class="btn btn-primary" id="exemptBtn">同意豁免该项</button>':['已通过','已豁免'].includes(item.status)?'<button class="btn" id="nextBtn">查看下一项</button>':'';
      $('reviewMain').innerHTML=`<header class="item-head"><div><div class="item-title">${esc(item.name)}</div><div class="item-sub">补充项 ${currentIndex+1}/${current.items.length} · 最近更新于 2026-08-17 10:${32+currentIndex}</div></div><span class="tag ${['已通过','已豁免'].includes(item.status)?'tag-green':canReview||canExempt?'tag-orange':'tag-gray'}"><span class="dot"></span>${item.status}</span></header><div class="review-content"><div class="review-grid"><div>${material}</div><aside><section class="card require-card"><div class="card-title">审核要求</div><p>${esc(item.desc)}</p>${lawyerReferencesTpl(item)}<div class="info-row"><div class="info-line"><span>发起人</span><b>刘律师（我）</b></div><div class="info-line"><span>用户提交截止</span><b>${esc(item.itemDeadline||current.deadline)}</b></div><div class="info-line"><span>是否必填</span><b>是</b></div></div></section><section class="card"><div class="card-title">审核规则</div><div class="todo-sub" style="line-height:1.8">逐项审核；无法提供的材料需明确同意豁免，不能自动视为通过。</div></section></aside></div></div><footer class="review-foot"><div class="foot-tip">${canExempt?'请判断该材料是否可以豁免':canReview?'请确认文件内容完整、清晰且与要求一致':'当前项暂无待处理操作'}</div><div class="foot-actions">${actions}</div></footer>`;
      document.querySelectorAll('.preview-file,.preview-reference').forEach(b=>b.onclick=()=>toast('已打开文件预览'));if($('returnBtn'))$('returnBtn').onclick=()=>show('returnMask');if($('continueBtn'))$('continueBtn').onclick=()=>show('returnMask');if($('passBtn'))$('passBtn').onclick=passCurrent;if($('exemptBtn'))$('exemptBtn').onclick=exemptCurrent;if($('nextBtn'))$('nextBtn').onclick=nextReview;
    }
    function lawyerReferencesTpl(item){let files=item.lawyerFiles||[];if(!files.length)return '';return `<div class="lawyer-reference"><div class="lawyer-reference-title">提供给用户的参考附件</div>${files.map(f=>`<div class="lawyer-reference-file"><span class="lawyer-reference-icon">参考</span><span class="lawyer-reference-name" title="${esc(f[0])}">${esc(f[0])}</span><button class="btn-link preview-reference">预览</button></div>`).join('')}</div>`}
    function passCurrent(){current.items[currentIndex].status='已通过';advanceReview('该项已通过')}
    function exemptCurrent(){current.items[currentIndex].status='已豁免';advanceReview('已同意豁免该项')}
    function advanceReview(message){let next=current.items.findIndex((x,i)=>i>currentIndex&&['已提交','无法提供待确认'].includes(x.status));if(next<0)next=current.items.findIndex(x=>['已提交','无法提供待确认'].includes(x.status));if(next>=0)currentIndex=next;let complete=current.items.every(x=>['已通过','已豁免'].includes(x.status));current.status=complete?'已完成':next>=0?'待我处理':'等待用户';renderReview();render();toast(complete?'材料已齐备，已生成文书制作节点':next>=0?`${message}，已进入下一项`:`${message}，等待用户补齐其余项目`)}
    function nextReview(){currentIndex=(currentIndex+1)%current.items.length;renderReview()}
    function confirmReturn(){let reason=$('returnReason').value.trim();if(!reason)return toast('请填写退回原因');let item=current.items[currentIndex];item.status='待用户补充';item.reviewFeedback=reason;item.itemDeadline=$('returnDeadline').value;item.previousFiles=item.files.slice();item.files=[];current.status=current.items.some(x=>['已提交','无法提供待确认'].includes(x.status))?'待我处理':'等待用户';$('returnReason').value='';hide('returnMask');renderReview();render();toast('退回原因和新截止时间已同步给用户')}
    function renderPendingReferences(){$('pendingReferenceList').innerHTML=pendingRequirementFiles.map((f,i)=>`<div class="pending-reference-item"><span title="${esc(f.name)}">${esc(f.name)}</span><button data-remove-reference="${i}">删除</button></div>`).join('');$('pendingReferenceList').querySelectorAll('[data-remove-reference]').forEach(b=>b.onclick=()=>{pendingRequirementFiles.splice(Number(b.dataset.removeReference),1);renderPendingReferences()})}
    function confirmAdd(){let name=$('requirementName').value.trim(),desc=$('requirementDesc').value.trim();if(!name||!desc)return toast('请填写补充项名称和律师说明');let lawyerFiles=pendingRequirementFiles.map(f=>[f.name,formatFileSize(f.size)]);current.items.push({name,status:'待用户补充',files:[],lawyerFiles,note:'',desc});currentIndex=current.items.length-1;hide('addMask');$('requirementName').value='';$('requirementDesc').value='';pendingRequirementFiles=[];renderPendingReferences();renderReview();toast(lawyerFiles.length?'补充要求及参考附件已同步到用户侧':'补充要求已发送到用户侧文书任务')}
    function formatFileSize(n){if(n<1024)return `${n} B`;if(n<1048576)return `${(n/1024).toFixed(1)} KB`;return `${(n/1048576).toFixed(1)} MB`}
    function show(id){$(id).classList.add('show')}function hide(id){$(id).classList.remove('show')}function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
    $('keyword').oninput=renderTable;$('typeFilter').onchange=renderTable;$('refreshBtn').onclick=()=>toast('待办已刷新');$('backBtn').onclick=()=>{$('reviewPage').classList.remove('show');$('listPage').classList.remove('hide');render()};$('addRequirement').onclick=()=>show('addMask');$('requirementFiles').onchange=e=>{pendingRequirementFiles.push(...Array.from(e.target.files));e.target.value='';renderPendingReferences()};$('confirmReturn').onclick=confirmReturn;$('confirmAdd').onclick=confirmAdd;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));document.querySelectorAll('.mask').forEach(m=>m.onclick=e=>{if(e.target===m)hide(m.id)});render();
  </script>
</body>
</html>
