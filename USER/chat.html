      const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms)); function scrollToBottom(smooth = false) { const top = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight); if (smooth) { window.scrollTo({ top, behavior: 'smooth' }); page.scrollTo?.({ top: page.scrollHeight, behavior: 'smooth' }); } else { window.scrollTo(0, top); page.scrollTop = page.scrollHeight; } }
      async function typeNode(source, target, token) {

      function openCasePanel() { openPanel('案件登记表', `<form class="service-form" data-case-form><h3>案件调查表单</h3><p class="intro">按案件登记表模板收集用户信息和案件资料，便于 AI 输出更完整的法律意见。</p><section class="form-card"><h3>1 用户信息</h3><input type="text" placeholder="姓名 / 手机号"><label><input name="role" type="radio" checked> 当事人</label><label><input name="role" type="radio"> 家属或代理人</label></section><section class="form-card"><h3>2 案件资料</h3><textarea placeholder="请填写事故时间、地点、经过、现有证据和对方信息"></textarea></section><section class="form-card"><h3>3 当前诉求</h3><textarea placeholder="例如责任划分、赔偿金额、立案起诉、文书生成或律师代理"></textarea></section><div class="form-actions"><button type="submit">生成法律意见书</button><button type="button" data-close-panel>稍后填写</button></div></form>`); }
      function openOpinionPanel() { openPanel('AI法律意见书', `<h3>劳动争议初步意见</h3><div class="reply-box">已根据案件登记表补充劳动关系、争议事实、证据材料和当前诉求，形成初步处理路径。</div><p><strong>建议路径：</strong>先固定劳动合同、工资流水、考勤、社保及解除通知等证据，再根据处理阶段选择沟通函、解除通知或仲裁申请文书。</p><p><strong>下一步：</strong>劳动争议一般先申请劳动仲裁；需要时可申请律师复核。</p><div class="form-actions"><button type="button" data-panel="human">申请人工复核</button><button type="button" data-close-panel>稍后处理</button></div>`); }
      function openHumanPanel() { openPanel('一对一付费服务', `<p class="intro">付款后可申请客服接待，由律师助理或律师在管理后台补充案件登记表；服务完成后可标记结案。</p><section class="pay-card"><strong>律师助理接待</strong><p>适合资料整理、流程说明、基础答疑和登记表补全。</p><div class="price">￥19.9</div><button class="service-cta" type="button" data-pay="assistant" data-pay-title="律师助理接待" data-pay-price="￥19.9">申请律师助理</button></section><section class="pay-card"><strong>律师一对一</strong><p>适合复杂案情、策略判断、证据风险和正式处理建议。</p><div class="price">￥59.9</div><button class="service-cta" type="button" data-pay="lawyer" data-pay-title="律师一对一" data-pay-price="￥59.9">申请律师服务</button></section>`); }
      function openPaymentPanel(key) { const item = services[key] || services.draft; openPanel(`${item.title}付款方案`, `<section class="pay-card"><strong>${item.title}</strong><p>${item.desc}</p><div class="price">${item.price}</div><div class="doc-list">${item.docs.map((doc) => `<span>${doc}</span>`).join('')}</div><p>${item.note}</p></section><form class="service-form" data-pay-form><section class="form-card"><h3>确认服务信息</h3><input type="text" placeholder="联系人 / 手机号"><textarea placeholder="补充需要优先处理的事项"></textarea></section><div class="form-actions"><button type="button" data-pay="${key}" data-pay-title="${item.title}" data-pay-price="${item.price}">确认付款</button><button type="button" data-close-panel>稍后再说</button></div></form>`); }
      dialog.addEventListener('click', (event) => {
        if (event.target.closest('[data-guide-buy]')) { openPanel('劳动仲裁文书与律师指导', `<div class="reply-box">已识别案由：${detectedCause}<br>劳动争议一般适用仲裁前置程序。</div><p>服务根据当前阶段匹配沟通函、被迫解除通知书，或仲裁申请书、证据清单、送达地址确认书。</p><section class="pay-card"><strong>服务价格</strong><div class="price">￥39起</div><p>下单后仍可继续补充劳动合同、工资、社保及解除材料。</p><button class="service-cta" type="button" data-pay="guide" data-pay-title="劳动仲裁文书与律师指导" data-pay-price="￥39起">确认获取服务</button></section>`); return; }
        if (event.target.closest('[data-guide-detail]')) { openPanel('服务内容说明', `<h3>劳动仲裁文书与律师指导</h3><div class="reply-box"><strong>仲裁前置：</strong>劳动争议一般需先申请劳动仲裁；对裁决不服，再依法向法院起诉。</div><h3>协商 / 通知阶段</h3><p><strong>沟通函：</strong>正式提出工资、加班费等诉求，固定协商经过和对方回应。</p><p><strong>被迫解除劳动关系通知书：</strong>在符合法定情形时明确解除原因和日期，并留存送达证据。</p><h3>仲裁申请阶段</h3><p><strong>仲裁申请书：</strong>写明当事人、仲裁请求及事实理由。</p><p><strong>证据清单：</strong>列明证据名称、来源和证明目的。</p><p><strong>送达地址确认书：</strong>确保及时接收开庭通知、裁决书等文件。</p><p>AI 负责初步归纳，最终文书由律师结合材料审核。</p>`); return; }
        const approvalOption = event.target.closest('[data-approval-option]');
        if (approvalOption) { const card = approvalOption.closest('#approvalCard'), current = Number(card.dataset.step); card.querySelectorAll('[data-approval-option]').forEach((button) => button.disabled = true); approvalOption.classList.add('selected'); card.classList.add('switching'); setTimeout(() => { const next = current + 1; if (next < documentQuestions.length) { card.dataset.step = String(next); card.querySelector('#approvalProgress').textContent = `${next + 1} / ${documentQuestions.length}`; card.querySelector('#approvalQuestion').textContent = documentQuestions[next].title; card.querySelector('#approvalOptions').innerHTML = approvalOptionsHtml(next); requestAnimationFrame(() => card.classList.remove('switching')); } else { revealServiceGuide(card); card.remove(); } }, 260); return; }
        if (event.target.closest('[data-approval-dismiss]')) { event.target.closest('#approvalCard').remove(); toast('已暂存，可稍后继续补充'); return; }
        const answerAction = event.target.closest('[data-answer-action]');
        if (answerAction) { if (answerAction.dataset.answerAction === 'copy') navigator.clipboard?.writeText(document.getElementById('answerDoc')?.innerText || ''); toast(answerAction.dataset.answerAction === 'copy' ? '回答已复制' : answerAction.dataset.answerAction === 'retry' ? '已重新生成回答' : '感谢你的反馈'); return; }
        const serviceCta = event.target.closest('.service-cta');
        if (serviceCta) { const key = serviceCta.closest('.service-card').dataset.service; openPaymentPanel(key); showQr(services[key].title, services[key].price); return; }
        const panelButton = event.target.closest('[data-panel]');
        if (panelButton?.dataset.panel === 'case') { openCasePanel(); return; }
        if (panelButton?.dataset.panel === 'human') { openHumanPanel(); return; }
        const lawButton = event.target.closest('.law-ref');
        if (lawButton) openLawPanel(lawButton.dataset.law);
      });
      lawPanel.addEventListener('click', (event) => { const panel = event.target.closest('[data-panel]')?.dataset.panel, pay = event.target.closest('[data-pay]'); if (event.target.closest('[data-close-qr]') || event.target.matches('[data-qr-mask]')) { lawPanel.querySelector('[data-qr-mask]')?.remove(); return; } if (panel === 'human') { openHumanPanel(); return; } if (pay) { showQr(pay.dataset.payTitle || lawPanelTitle.textContent, pay.dataset.payPrice || lawPanel.querySelector('.price')?.textContent.trim()); return; } if (event.target.closest('[data-close-panel]')) lawClose.click(); }); lawPanel.addEventListener('submit', (event) => { event.preventDefault(); if (event.target.matches('[data-case-form]')) { openOpinionPanel(); toast('已生成法律意见书'); return; } if (event.target.matches('[data-pay-form]')) { showQr(lawPanelTitle.textContent, lawPanel.querySelector('.price')?.textContent.trim()); return; } toast('已提交服务需求'); lawClose.click(); });
      lawClose.addEventListener('click', () => {
        lawPanel.classList.remove('open');
        lawPanel.setAttribute('aria-hidden', 'true');
      });
      polishBtn.addEventListener('click', () => {
        const text = prompt.value.trim();
        if (!text) {
          toast('先输入问题，再帮你润色');
          prompt.focus();
          return;
        }
        prompt.value = `请将以下问题整理为清晰、专业、可执行的法律提问：\n${text}`;
        resizePrompt();
        updateSend();
        toast('已润色为结构化提问');
      });
      document.querySelector('.side-back').addEventListener('click', () => {
        if (page.classList.contains('chatting')) {
          page.classList.remove('chatting');
          dialog.innerHTML = '';
          toast('已回到首页');
          return;
        }
        toast('当前已在首页');
      });
      document.querySelector('.help').addEventListener('click', () => {
        openHumanPanel();
      });
      const initialQuestion = getInitialQuestion();
      if (initialQuestion) {
        showAnswer(initialQuestion, []);
      }
      updateSend();
    })();
  </script>
</body>
</html>
