  <style>

:0 11px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;min-width:0}.workspace-file-icon{width:28px;height:28px;margin-right:9px;border-radius:5px;background:#e8f3ff;color:var(--primary);display:flex;align-items:center;justify-content:center;font-size:11px}.workspace-file-name{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.workspace-file-size{margin-left:10px;color:var(--text-3);font-size:11px}.workspace-remove{margin-left:10px;border:0;background:transparent;color:var(--danger);cursor:pointer}.workspace-textarea{width:100%;min-height:92px}.editor-foot{padding:13px 20px;border-top:1px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px}.autosave-tip{color:var(--text-3);font-size:12px}.editor-actions{display:flex;gap:9px}.btn-next{min-width:156px}.submitted-panel{padding:30px;text-align:center;color:var(--text-2)}.submitted-panel strong{display:block;margin-bottom:8px;color:var(--success);font-size:18px}
    @media(max-width:1250px){.work-page{padding:12px}.work-shell{height:calc(100vh - 24px)}.work-layout{grid-template-columns:270px minmax(0,1fr)}.workspace-files{grid-template-columns:1fr}.evidence-editor-wrap{padding:12px}}

<body>
  <div class="page"><main class="panel">
    <svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true"><symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M12 10v6m0-9h.01" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></symbol><symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="m16.3 16.3 4 4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol><symbol id="i-doc" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14 3v5h4M9 12h6M9 16h6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol><symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 15v4h14v-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol></svg>
    <header class="panel-head"><div><div class="title">文书任务</div><div class="subtitle">集中查看文书办理进度，并按顾问要求补充所需材料。</div></div><div class="head-note"><svg><use href="#i-info"/></svg>任务由服务顾问发起；有新增材料要求时，请在对应任务中提交。</div></header>
    <section class="metrics" id="metrics"></section>
    <nav class="tabs" id="tabs" aria-label="任务状态筛选"></nav>
    <div class="toolbar"><div class="search"><input id="keyword" placeholder="搜索任务名称、案件编号或文书类型"/><svg><use href="#i-search"/></svg></div><select class="select" id="typeFilter"><option value="">全部文书类型</option></select><div class="toolbar-tip">材料提交后将由服务顾问审核，审核结果会同步更新</div></div>
    <section class="list" id="taskList"></section>
    <footer class="footer"><div id="totalText"></div><div class="pages"><button class="page-btn">‹</button><button class="page-btn active">1</button><button class="page-btn">›</button><span>10 条/页</span></div></footer>
  </main></div>
  <section class="work-page" id="workPage"><div class="work-shell">
    <header class="work-head"><div class="work-head-top"><div><div class="work-breadcrumb"><button class="back-btn" id="backToTasks">← 返回文书任务</button><span>/</span><span id="workBreadcrumb"></span></div><div class="work-title" id="workTitle"></div><div class="work-meta" id="workMeta"></div></div><div class="work-deadline"><span class="tag tag-orange" id="workStatus"></span><strong id="workDeadline"></strong></div></div><div class="work-progress"><div class="work-progress-copy">补充进度<span id="workProgressText"></span></div><div class="work-progress-track"><span class="work-progress-fill" id="workProgressFill"></span></div><div class="work-progress-tip" id="workProgressTip"></div></div></header>
    <div class="work-layout"><aside class="evidence-nav"><div class="evidence-nav-head"><div class="evidence-nav-title">补充项清单</div><div class="evidence-nav-sub">逐项提交，系统会自动保存草稿</div></div><div class="item-filters" id="itemFilters"></div><div class="evidence-list" id="evidenceList"></div></aside><div class="evidence-editor-wrap"><main class="evidence-editor" id="evidenceEditor"></main></div></div>
  </div></section>
  <div class="drawer-mask" id="drawerMask"><aside class="drawer" role="dialog" aria-modal="true"><div class="drawer-head"><div><div class="drawer-title" id="drawerTitle"></div><div class="subtitle" id="drawerSub"></div></div><button class="close" data-close="drawerMask" aria-label="关闭">×</button></div><div class="drawer-body" id="drawerBody"></div><div class="drawer-foot"><button class="btn" data-close="drawerMask">关闭</button><button class="btn btn-primary" id="drawerUpload">补充材料</button></div></aside></div>
  <div class="modal-mask" id="uploadMask"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><span id="uploadTitle">补充材料</span><button class="close" data-close="uploadMask" aria-label="关闭">×</button></div><div class="modal-body"><div class="notice" id="uploadNotice"></div><label class="upload-box" for="fileInput"><div class="upload-icon"><svg><use href="#i-upload"/></svg></div><div class="upload-main">点击选择文件，或将文件拖拽到此处</div><div class="upload-sub">支持 PDF、Word、Excel、图片、压缩包，单个文件不超过 50MB</div><input id="fileInput" type="file" multiple hidden accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.zip,.rar"/></label><div class="file-list" id="fileList"></div><label class="form-label" for="remark">补充说明（选填）</label><textarea id="remark" maxlength="300" placeholder="如有需要，可说明材料内容或需顾问特别关注的信息"></textarea></div><div class="modal-foot"><button class="btn" data-close="uploadMask">取消</button><button class="btn btn-primary" id="submitUpload">提交材料</button></div></section></div>
  <div class="toast" id="toast"></div>
  <script>
    const tasks=[
      {id:'WS20260816001',name:'民事起诉状（货款纠纷）',caseNo:'AJ20260812008',type:'诉讼文书',status:'待补充',required:['供货合同及补充协议','相关发票与付款记录','发货或签收凭证','被告最新工商登记信息','双方盖章的对账单','最后一次催款记录','对方确认欠款的聊天记录','其他可证明欠款事实的材料'],missing:5,deadline:'2026-08-19 18:00',updated:'2026-08-17 09:35',advisor:'刘律师',description:'为确认被告主体信息及欠款事实，请按清单逐项补充材料；如某项确实无法提供，可填写原因说明后提交。',history:[['2026-08-17 09:35','刘律师新增5项证据材料要求'],['2026-08-16 16:20','已提交供货合同.pdf、发票明细.xlsx、签收单.jpg'],['2026-08-16 10:08','文书任务已创建']]},
      {id:'WS20260815002',name:'劳动仲裁申请书',caseNo:'AJ20260810003',type:'仲裁文书',status:'待补充',required:['解除劳动关系通知书','近12个月工资流水','加班记录或考勤截图'],missing:1,deadline:'2026-08-18 12:00',updated:'2026-08-16 17:42',advisor:'王律师',description:'工资流水已收到，请继续补充可以证明实际加班时间的考勤或聊天记录。',history:[['2026-08-16 17:42','审核反馈：工资流水清晰，仍缺少加班记录'],['2026-08-16 14:06','已提交工资流水.pdf'],['2026-08-15 11:30','文书任务已创建']]},
      {id:'WS20260814006',name:'离婚协议书',caseNo:'AJ20260808011',type:'协议文书',status:'审核中',required:['双方身份信息','财产清单','子女抚养方案'],missing:0,deadline:'2026-08-20 18:00',updated:'2026-08-17 08:20',advisor:'沈律师',description:'材料已提交，服务顾问正在核验财产清单和子女抚养方案。',history:[['2026-08-17 08:20','已提交子女抚养方案.docx，进入审核'],['2026-08-15 15:12','已提交财产清单.xlsx'],['2026-08-14 09:50','文书任务已创建']]},
      {id:'WS20260812009',name:'律师函（合同违约）',caseNo:'AJ20260805007',type:'非诉文书',status:'已完成',required:['合同及补充协议','履约凭证','收件方送达信息'],missing:0,deadline:'2026-08-16 18:00',updated:'2026-08-16 15:10',advisor:'周律师',description:'文书已完成，可在订单详情中查看并下载最终文件。',history:[['2026-08-16 15:10','律师函已完成并交付'],['2026-08-14 10:24','补充材料审核通过'],['2026-08-12 13:18','文书任务已创建']]},
      {id:'WS20260810004',name:'执行申请书',caseNo:'AJ20260728005',type:'诉讼文书',status:'已完成',required:['生效判决书','生效证明','申请执行人收款账户'],missing:0,deadline:'2026-08-14 18:00',updated:'2026-08-14 11:03',advisor:'许律师',description:'材料审核完成，执行申请书已交付。',history:[['2026-08-14 11:03','执行申请书已完成并交付'],['2026-08-12 09:46','全部材料审核通过'],['2026-08-10 14:22','文书任务已创建']]}
    ];
    const statusClass={待补充:'tag-orange',审核中:'tag-blue',已完成:'tag-green'};
    let active='全部',currentId='',selectedFiles=[],evidenceFilter='全部',currentItemIndex=0;
    const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
    function init(){fillTypes();render();bind();notifyPendingCount();}
    function fillTypes(){[...new Set(tasks.map(x=>x.type))].forEach(t=>$('typeFilter').insertAdjacentHTML('beforeend',`<option>${t}</option>`));}
    function filtered(){let k=$('keyword').value.trim().toLowerCase(),type=$('typeFilter').value;return tasks.filter(t=>(active==='全部'||t.status===active)&&(!type||t.type===type)&&(!k||`${t.name} ${t.caseNo} ${t.type} ${t.id}`.toLowerCase().includes(k)));}
    function render(){renderMetrics();renderTabs();renderList();}
    function renderMetrics(){let data=[['全部任务',tasks.length,'项'],['待补充',tasks.filter(x=>x.status==='待补充').length,'项待处理'],['审核中',tasks.filter(x=>x.status==='审核中').length,'项'],['已完成',tasks.filter(x=>x.status==='已完成').length,'项']];$('metrics').innerHTML=data.map(x=>`<div class="metric"><div class="metric-label">${x[0]}</div><div class="metric-value">${x[1]}<small>${x[2]}</small></div></div>`).join('');}
    function renderTabs(){$('tabs').innerHTML=['全部','待补充','审核中','已完成'].map(s=>`<button class="tab ${s===active?'active':''}" data-status="${s}">${s}<span class="tab-count">${s==='全部'?tasks.length:tasks.filter(x=>x.status===s).length}</span></button>`).join('');$('tabs').querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.status;render();});}
    function renderList(){let rows=filtered();$('totalText').textContent=`共 ${rows.length} 条任务`;if(!rows.length){$('taskList').innerHTML='<div class="empty">暂无符合条件的文书任务</div>';return;}$('taskList').innerHTML=rows.map(taskTpl).join('');$('taskList').querySelectorAll('[data-action]').forEach(b=>b.onclick=handleAction);}
    function taskTpl(t){let action=t.status==='待补充'?'<button class="primary-link" data-action="upload">补充材料</button>':t.status==='已完成'?'<button class="primary-link" data-action="delivery">查看交付</button>':'';return `<article class="task" data-id="${t.id}"><div class="task-main"><div class="doc-icon"><svg><use href="#i-doc"/></svg></div><div style="min-width:0"><div class="task-name" title="${esc(t.name)}">${esc(t.name)}</div><div class="task-meta">${t.id}　·　${t.caseNo}</div></div></div><div><div class="need-title">材料要求</div><div class="need-content">${t.missing?`还需处理 <span class="need-count">${t.missing} 项</span>`:t.status==='已完成'?'最终文书已交付':'材料已提交完整'}</div></div><div><span class="tag ${statusClass[t.status]}">${t.status}</span></div><div><div class="date-label">${t.status==='已完成'?'交付时间':'提交截止'}</div><div class="date-value">${t.status==='已完成'?t.updated:t.deadline}</div></div><div class="actions"><button class="link" data-action="detail">详情</button>${action}</div></article>`;}
    function handleAction(e){let row=e.target.closest('.task');currentId=row.dataset.id,action=e.currentTarget.dataset.action;if(action==='upload')openWorkspace(currentId);else if(action==='delivery')location.href='./document-delivery.html';else openDetail(currentId);}
    function task(id){return tasks.find(x=>x.id===id)||tasks[0];}
    function openDetail(id){let t=task(id);currentId=id;$('drawerTitle').textContent=t.name;$('drawerSub').textContent=`${t.id} · ${t.caseNo}`;$('drawerBody').innerHTML=`<div class="info-card"><div class="info-grid">${kv('当前状态',`<span class="tag ${statusClass[t.status]}">${t.status}</span>`)+kv('服务顾问',t.advisor)+kv('文书类型',t.type)+kv('提交截止',t.deadline)}</div></div><div class="section"><div class="section-title">本次材料要求</div>${t.required.map((x,i)=>`<div class="required-item"><div><div class="required-name">${i+1}. ${esc(x)}</div><div class="required-desc">${t.status==='待补充'&&i>=t.required.length-t.missing?'仍需补充，请确保文件内容清晰完整。':'已提交或无需再次补充。'}</div></div><span class="tag ${t.status==='待补充'&&i>=t.required.length-t.missing?'tag-orange':'tag-gray'}">${t.status==='待补充'&&i>=t.required.length-t.missing?'待补充':'已提交'}</span></div>`).join('')}</div><div class="section"><div class="section-title">顾问说明</div><div class="kv-value">${esc(t.description)}</div></div><div class="section"><div class="section-title">处理记录</div><div class="history">${t.history.map(h=>`<div class="history-item"><div class="history-time">${h[0]}</div><div class="history-text">${esc(h[1])}</div></div>`).join('')}</div></div>`;$('drawerUpload').style.display=t.status==='待补充'?'':'none';show('drawerMask');}
    function kv(label,value){return `<div><div class="kv-label">${label}</div><div class="kv-value">${value}</div></div>`;}
    function openUpload(id){let t=task(id);currentId=id;selectedFiles=[];$('uploadTitle').textContent=`补充材料 · ${t.name}`;$('uploadNotice').innerHTML=`顾问说明：${esc(t.description)}<br>本次还需补充 <strong>${t.missing}</strong> 项材料，请在 ${t.deadline} 前提交。`;$('remark').value='';renderFiles();show('uploadMask');}
    function renderFiles(){if(!selectedFiles.length){$('fileList').innerHTML='';return;}$('fileList').innerHTML=selectedFiles.map((f,i)=>`<div class="file-item"><div class="file-name">${esc(f.name)}</div><div class="file-size">${formatSize(f.size)}</div><button class="remove" data-remove="${i}">删除</button></div>`).join('');$('fileList').querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{selectedFiles.splice(Number(b.dataset.remove),1);renderFiles();});}
    function formatSize(n){if(n<1024)return `${n} B`;if(n<1048576)return `${(n/1024).toFixed(1)} KB`;return `${(n/1048576).toFixed(1)} MB`;}
    function ensureEvidenceItems(t){if(t.items)return t.items;let submitted=Math.max(0,t.required.length-t.missing);t.items=t.required.map((name,i)=>{let item={name,required:i!==t.required.length-1,status:i<submitted?'待审核':'待补充',files:i<submitted?[{name:seedFileName(name),size:860000+i*152000}]:[],lawyerFiles:lawyerReferenceFiles(name),remark:i<submitted?'材料已按律师要求提交。':'',description:evidenceDescription(name),noMaterial:false};if(t.id==='WS20260816001'&&i<2)item.status='审核通过';if(t.id==='WS20260816001'&&i===2){item.status='已退回';item.reviewFeedback='签收页缺少收货方签字，请补充包含签字或盖章的完整页面。';item.itemDeadline='2026-08-20 18:00';item.previousFiles=item.files.slice();item.files=[];}return item});return t.items;}
    function itemGroup(item){if(['待补充','草稿','已退回'].includes(item.status))return '待处理';if(['待审核','无法提供待确认'].includes(item.status))return '待审核';if(['审核通过','已豁免'].includes(item.status))return '已完成';return item.status;}
    function filterMatches(item){return evidenceFilter==='全部'||itemGroup(item)===evidenceFilter;}
    function seedFileName(name){if(name.includes('合同'))return '供货合同及补充协议.pdf';if(name.includes('发票'))return '发票及付款明细.xlsx';if(name.includes('签收'))return '签收单据.jpg';return `${name}.pdf`;}
    function evidenceDescription(name){let map=[['工商','请上传国家企业信用信息公示系统或其他权威渠道查询的最新工商登记信息，需包含企业名称、统一社会信用代码及注册地址。'],['对账单','请上传双方确认或盖章的完整对账单，确保金额、日期和印章清晰可辨。'],['催款','请上传最后一次催款的短信、微信、邮件或书面函件，并保留发送时间和对方信息。'],['聊天','请上传能够体现对方确认欠款金额或付款承诺的完整聊天记录，避免只截取单句。'],['其他','如有其他可以证明供货、验收、欠款或催收事实的材料，可在此补充；确实没有也可以填写说明。']];let hit=map.find(x=>name.includes(x[0]));return hit?hit[1]:`请上传与“${name}”对应的完整证据材料，确保内容清晰、页码连续，并保留原始文件。`;}
    function lawyerReferenceFiles(name){if(name.includes('工商'))return [{name:'工商信息查询示例.pdf',size:942080}];if(name.includes('签收'))return [{name:'签收凭证整理示例.pdf',size:696320}];return [];}
    function openWorkspace(id){let t=task(id);currentId=id;ensureEvidenceItems(t);evidenceFilter='全部';currentItemIndex=Math.max(0,t.items.findIndex(x=>itemGroup(x)==='待处理'));document.querySelector('.page').classList.add('work-hidden');$('workPage').classList.add('show');renderWorkspace();}
    function closeWorkspace(){saveCurrentDraft(true);$('workPage').classList.remove('show');document.querySelector('.page').classList.remove('work-hidden');render();}
    function renderWorkspace(){let t=task(currentId),items=ensureEvidenceItems(t),handled=items.filter(x=>itemGroup(x)!=='待处理').length,approved=items.filter(x=>itemGroup(x)==='已完成').length,remaining=items.filter(x=>itemGroup(x)==='待处理').length,pct=Math.round(handled/items.length*100),editorItem=filterMatches(items[currentItemIndex])?items[currentItemIndex]:null;$('workBreadcrumb').textContent=t.id;$('workTitle').textContent=t.name;$('workMeta').textContent=`关联案件：${t.caseNo}　·　服务顾问：${t.advisor}　·　${t.type}`;$('workStatus').textContent=t.status;$('workStatus').className=`tag ${t.status==='待补充'?'tag-orange':'tag-blue'}`;$('workDeadline').textContent=`截止时间：${items[currentItemIndex].itemDeadline||t.deadline}`;$('workProgressText').textContent=`${handled}/${items.length}`;$('workProgressFill').style.width=`${pct}%`;$('workProgressTip').textContent=remaining?`还需处理 ${remaining} 项，${approved} 项已通过/豁免`:`全部补充项已提交，等待律师审核`;renderItemFilters(items);renderEvidenceList(items);renderEvidenceEditor(editorItem);}
    function renderItemFilters(items){let defs=['全部','待处理','待审核','已完成'].map(x=>[x,x==='全部'?items.length:items.filter(i=>itemGroup(i)===x).length]);$('itemFilters').innerHTML=defs.map(x=>`<button class="item-filter ${evidenceFilter===x[0]?'active':''}" data-filter="${x[0]}">${x[0]} ${x[1]}</button>`).join('');$('itemFilters').querySelectorAll('button').forEach(b=>b.onclick=()=>{saveCurrentDraft(true);evidenceFilter=b.dataset.filter;if(!filterMatches(items[currentItemIndex])){let next=items.findIndex(filterMatches);if(next>=0)currentItemIndex=next;}renderWorkspace();});}
    function renderEvidenceList(items){let indexed=items.map((item,index)=>({item,index})).filter(x=>filterMatches(x.item));if(!indexed.length){$('evidenceList').innerHTML='<div class="evidence-empty">该状态下暂无补充项</div>';return;}$('evidenceList').innerHTML=indexed.map(({item,index})=>`<button class="evidence-item ${index===currentItemIndex?'active':''}" data-index="${index}"><span class="status-dot ${itemGroup(item)==='已完成'?'dot-submitted':itemGroup(item)==='待审核'?'dot-draft':'dot-pending'}"></span><span class="evidence-copy"><span class="evidence-name">${index+1}. ${esc(item.name)}${item.required?'<span class="required-mark">*</span>':''}</span><span class="evidence-state">${item.status}${item.files.length?` · ${item.files.length} 个文件`:''}</span></span></button>`).join('');$('evidenceList').querySelectorAll('.evidence-item').forEach(b=>b.onclick=()=>{saveCurrentDraft(true);currentItemIndex=Number(b.dataset.index);renderWorkspace();});}
    function renderEvidenceEditor(item){
      if(!item){$('evidenceEditor').innerHTML='<div class="submitted-panel">当前筛选下暂无可编辑内容</div>';return;}
      let locked=itemGroup(item)!=='待处理',t=task(currentId),feedback=item.reviewFeedback?`<div class="review-feedback"><strong>律师退回意见</strong>${esc(item.reviewFeedback)}<small>请于 ${esc(item.itemDeadline||t.deadline)} 前重新提交；上一版文件已保留在处理记录中。</small></div>`:'';
      let body=locked?(item.noMaterial||item.status==='无法提供待确认'?`<div class="editor-section"><div class="editor-section-title">无法提供说明</div><div class="kv-value">${esc(item.remark)}</div></div>`:`<div class="editor-section"><div class="editor-section-title">已提交材料</div>${workspaceFilesTpl(item,true)}</div><div class="editor-section"><div class="editor-section-title">补充说明</div><div class="kv-value">${esc(item.remark||'未填写补充说明')}</div></div>`):`${item.noMaterial?`<div class="no-material-box show"><strong>正在申请无法提供该材料</strong><div style="margin-top:6px">请在下方说明客观原因，提交后由律师确认是否豁免。</div><div class="no-material-actions"><button class="no-material-btn" id="cancelNoMaterial">改为上传材料</button></div></div>`:`<div class="editor-section"><div class="editor-section-title">上传证据材料</div><label class="editor-upload" for="workspaceFileInput"><div class="upload-icon"><svg><use href="#i-upload"/></svg></div><div class="upload-main">点击选择文件，或将文件拖拽到此处</div><div class="upload-sub">支持 PDF、Word、Excel、图片、压缩包，单个文件不超过 50MB</div><input id="workspaceFileInput" type="file" multiple hidden accept=".pdf,.doc,.docx,.xls,.xlsx,.jpg,.jpeg,.png,.zip,.rar"/></label>${workspaceFilesTpl(item,false)}</div>`}<div class="editor-section"><div class="editor-section-title">${item.noMaterial?'无法提供原因':'补充说明（选填）'}</div><textarea class="workspace-textarea" id="workspaceRemark" maxlength="500" placeholder="${item.noMaterial?'请说明为什么无法提供，以及是否有替代材料':'请输入材料内容或证据来源'}">${esc(item.remark)}</textarea></div>`;
      let stateClass=itemGroup(item)==='已完成'?'tag-green':itemGroup(item)==='待审核'?'tag-blue':item.status==='草稿'?'tag-orange':'tag-gray';
      $('evidenceEditor').innerHTML=`<div class="editor-head"><div><div class="editor-title">${esc(item.name)}${item.required?'<span class="required-mark">（必填）</span>':''}</div><div class="editor-meta">由 ${esc(t.advisor)} 发起 · ${esc(item.itemDeadline||t.deadline)} 前提交</div></div><span class="tag ${stateClass}">${item.status}</span></div><div class="editor-content">${feedback}<div class="lawyer-note"><div class="lawyer-note-title">律师补充说明</div><p>${esc(item.description)}</p>${lawyerReferenceTpl(item)}</div>${body}</div><div class="editor-foot"><div class="autosave-tip">${locked?item.status==='审核通过'?'该项已通过审核':item.status==='已豁免'?'该项已获律师豁免':'已提交，等待律师审核':'切换补充项时自动保存当前草稿'}</div><div class="editor-actions">${locked?'<button class="btn" id="goNextItem">查看下一项</button>':`<button class="btn" id="saveDraft">保存草稿</button>${item.noMaterial?'':'<button class="btn" id="noMaterialBtn">无法提供材料</button>'}<button class="btn btn-primary btn-next" id="submitCurrentItem">${item.noMaterial?'提交无法提供说明':'提交当前项并处理下一项'}</button>`}</div></div>`;
      bindWorkspaceEditor(locked);
    }
    function lawyerReferenceTpl(item){let files=item.lawyerFiles||[];if(!files.length)return '';return `<div class="lawyer-reference-list"><div class="lawyer-reference-label">律师提供的参考附件（不需要重复上传）</div>${files.map((f,i)=>`<div class="lawyer-reference-file"><span class="lawyer-reference-icon">参考</span><span class="lawyer-reference-name" title="${esc(f.name)}">${esc(f.name)}</span><span class="lawyer-reference-size">${formatSize(f.size)}</span><button class="lawyer-download" data-lawyer-download="${i}">下载</button></div>`).join('')}</div>`;}
    function workspaceFilesTpl(item,readOnly){if(!item.files.length)return readOnly?'<div class="evidence-empty">暂无文件记录</div>':'<div class="workspace-files"></div>';return `<div class="workspace-files">${item.files.map((f,i)=>`<div class="workspace-file"><div class="workspace-file-icon">文件</div><div class="workspace-file-name" title="${esc(f.name)}">${esc(f.name)}</div><div class="workspace-file-size">${formatSize(f.size)}</div>${readOnly?'':`<button class="workspace-remove" data-remove-file="${i}">删除</button>`}</div>`).join('')}</div>`;}
    function bindWorkspaceEditor(locked){let t=task(currentId),item=t.items[currentItemIndex];$('evidenceEditor').querySelectorAll('[data-lawyer-download]').forEach(b=>b.onclick=()=>downloadLawyerReference(item.lawyerFiles[Number(b.dataset.lawyerDownload)]));if(locked){let next=$('goNextItem');if(next)next.onclick=goNextEvidence;return;}let input=$('workspaceFileInput');if(input)input.onchange=e=>{item.files.push(...Array.from(e.target.files));item.noMaterial=false;item.status='草稿';renderWorkspace();};$('workspaceRemark').oninput=e=>item.remark=e.target.value;$('saveDraft').onclick=()=>saveCurrentDraft(false);$('submitCurrentItem').onclick=submitCurrentEvidence;let noMaterial=$('noMaterialBtn'),cancel=$('cancelNoMaterial');if(noMaterial)noMaterial.onclick=()=>{item.noMaterial=true;item.files=[];item.status='草稿';renderWorkspace()};if(cancel)cancel.onclick=()=>{item.noMaterial=false;item.status='草稿';renderWorkspace()};$('evidenceEditor').querySelectorAll('[data-remove-file]').forEach(b=>b.onclick=()=>{item.files.splice(Number(b.dataset.removeFile),1);item.status=item.files.length||item.remark?'草稿':item.reviewFeedback?'已退回':'待补充';renderWorkspace();});}
    function downloadLawyerReference(file){let blob=new Blob([`君穗AI原型参考附件：${file.name}`],{type:'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=file.name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),500);toast(`开始下载：${file.name}`);}
    function saveCurrentDraft(silent){let t=task(currentId);if(!t.items)return;let item=t.items[currentItemIndex],remark=$('workspaceRemark');if(remark)item.remark=remark.value;if(itemGroup(item)==='待处理')item.status=item.files.length||item.remark.trim()||item.noMaterial?'草稿':item.reviewFeedback?'已退回':'待补充';t.missing=t.items.filter(x=>itemGroup(x)==='待处理').length;if(!silent){renderWorkspace();toast('草稿已保存');}}
    function submitCurrentEvidence(){let t=task(currentId),item=t.items[currentItemIndex],remark=$('workspaceRemark');if(remark)item.remark=remark.value;if(item.noMaterial&&!item.remark.trim())return toast('请填写无法提供该材料的原因');if(!item.noMaterial&&!item.files.length)return toast('请上传材料；如确实无法提供，请选择“无法提供材料”');item.status=item.noMaterial?'无法提供待确认':'待审核';t.history.unshift([now(),`${item.noMaterial?'申请无法提供':'提交补充项'}：${item.name}`]);t.missing=t.items.filter(x=>itemGroup(x)==='待处理').length;if(!t.missing){t.status='审核中';active='审核中';}notifyPendingCount();let next=t.items.findIndex((x,i)=>i>currentItemIndex&&itemGroup(x)==='待处理');if(next<0)next=t.items.findIndex(x=>itemGroup(x)==='待处理');if(next>=0)currentItemIndex=next;renderWorkspace();toast(t.missing?'当前项已提交，已进入下一项':'全部补充项已提交，等待律师审核');}
    function goNextEvidence(){let items=task(currentId).items,next=items.findIndex((x,i)=>i>currentItemIndex&&itemGroup(x)==='待处理');if(next<0)next=items.findIndex(x=>itemGroup(x)==='待处理');if(next<0)next=(currentItemIndex+1)%items.length;currentItemIndex=next;renderWorkspace();}
    function submit(){if(!selectedFiles.length)return toast('请先选择需要提交的材料');let t=task(currentId);t.status='审核中';t.missing=0;t.updated=now();t.history.unshift([t.updated,`已补充提交 ${selectedFiles.length} 份材料，等待顾问审核`]);hide('uploadMask');hide('drawerMask');active='审核中';render();notifyPendingCount();toast('材料提交成功，服务顾问将尽快审核');}
    function bind(){$('keyword').oninput=renderList;$('typeFilter').onchange=renderList;$('fileInput').onchange=e=>{selectedFiles.push(...Array.from(e.target.files));e.target.value='';renderFiles();};$('submitUpload').onclick=submit;$('drawerUpload').onclick=()=>{hide('drawerMask');openWorkspace(currentId);};$('backToTasks').onclick=closeWorkspace;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));$('drawerMask').onclick=e=>{if(e.target===$('drawerMask'))hide('drawerMask');};$('uploadMask').onclick=e=>{if(e.target===$('uploadMask'))hide('uploadMask');};document.addEventListener('keydown',e=>{if(e.key==='Escape'){hide('drawerMask');hide('uploadMask');}});}
    function notifyPendingCount(){window.parent.postMessage({type:'document-task-pending-count',count:tasks.filter(x=>x.status==='待补充').length},'*');}
    function show(id){$(id).classList.add('show')}function hide(id){$(id).classList.remove('show')}function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2300)}function now(){let d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
    init();
  </script>
