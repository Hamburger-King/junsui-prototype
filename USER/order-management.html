    function fill(id,arr){$(id).innerHTML='<option value="">全部</option>'+arr.map(v=>`<option>${v}</option>`).join('');}
    function renderTabs(){$('tabs').innerHTML=['全部',...services].map(t=>`<button class="order-tab ${t===activeTab?'active':''}" data-tab="${t}">${t}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;page=1;renderTabs();renderAll();});}
    function filteredRows(){let k=$('keyword').value.trim().toLowerCase(),start=$('startDate').value,end=$('endDate').value;return orders.filter(r=>{let hay=`${r.id} ${r.user} ${r.phone} ${r.caseNo} ${r.summary}`.toLowerCase();if(activeTab!=='全部'&&r.service!==activeTab)return false;if(k&&!hay.includes(k))return false;if($('serviceFilter').value&&r.service!==$('serviceFilter').value)return false;if($('stageFilter').value&&r.stage!==$('stageFilter').value)return false;if($('statusFilter').value&&r.status!==$('statusFilter').value)return false;if($('payFilter').value&&r.pay!==$('payFilter').value)return false;if($('ownerFilter').value&&r.owner!==$('ownerFilter').value)return false;if(start&&r.createdAt<start)return false;if(end&&r.createdAt>end)return false;return true;});}
    function renderAll(){renderTable();}
    function renderHead(){$('tableHead').innerHTML='<tr><th class="check-col"><input type="checkbox" id="checkAll"/></th><th class="id-col">订单编号</th><th class="client-col">服务对象 / 案件</th><th class="service-col">服务类型</th><th class="stage-col">当前阶段</th><th class="stage-col">流程进度</th><th class="status-col">订单状态</th><th class="pay-col">支付状态</th><th class="amount-col">金额</th><th class="owner-col">服务顾问</th><th class="time-col">下单时间</th><th class="op-col">操作</th></tr>';}
    function renderTable(){renderHead();let data=filteredRows(),rows=data.slice((page-1)*pageSize,page*pageSize);$('totalText').textContent=`共 ${data.length} 条`;$('jumpInput').value=page;if(!rows.length){$('tableBody').innerHTML='<tr><td colspan="12" class="empty">暂无符合条件的订单</td></tr>';$('pager').innerHTML='';return;}$('tableBody').innerHTML=rows.map(rowTpl).join('');$('tableBody').querySelectorAll('[data-action]').forEach(b=>b.onclick=onAction);renderPager(data.length);}
    function rowTpl(r){return `<tr><td class="check-col"><input class="row-check" type="checkbox"/></td><td title="${r.id}">${r.id}</td><td><div class="main-text">${esc(r.user)}</div><div class="sub-text">${esc(r.caseNo)} / ${esc(r.phone)}</div></td><td>${esc(r.service)}</td><td>${esc(r.stage)}</td><td>${progressTpl(r)}</td><td><span class="tag ${statusTag[r.status]}">${esc(r.status)}</span></td><td><span class="tag ${payTag[r.pay]}">${esc(r.pay)}</span></td><td>¥${r.amount}</td><td>${esc(r.owner)}</td><td>${esc(r.createdAt)}</td><td><div class="table-action">${actions(r)}</div></td></tr>`;}
    function progressTpl(r){let flow=flowMap[r.service],idx=Math.max(0,flow.indexOf(r.stage)),p=Math.round((idx+1)/flow.length*100);return `<div class="progress"><span>${p}%</span><span class="progress-track"><span class="progress-fill" style="width:${p}%"></span></span></div>`;}
    function actions(r){let items=[`<button class="link-btn" data-action="detail" data-id="${r.id}">查看详情</button>`];if(r.pay==='待支付'||r.pay==='支付失败')items.push(`<button class="link-btn" data-action="pay" data-id="${r.id}">去支付</button>`);if(r.status==='待用户补充')items.push(`<button class="link-btn" data-action="supplement" data-id="${r.id}">补充材料</button>`);if(r.status==='待交付'||r.status==='已完成'||r.docs.length)items.push(`<button class="link-btn" data-action="download" data-id="${r.id}">下载文件</button>`);if(r.pay==='已支付'&&!['已完成','已退款','退费审核中'].includes(r.status))items.push(`<button class="link-btn" data-action="refundApply" data-id="${r.id}">申请退费</button>`);if(r.pay==='已支付'&&!['已完成','已退款'].includes(r.status))items.push(`<button class="link-btn" data-action="contact" data-id="${r.id}">联系顾问</button>`);if(r.status==='退费审核中'||r.status==='已退款'||r.pay==='已退款')items.push(`<button class="link-btn muted" data-action="refund" data-id="${r.id}">退款详情</button>`);return items.join('');}
    function renderPager(total){let pages=Math.max(1,Math.ceil(total/pageSize));if(page>pages)page=pages;let html=`<button class="page-arrow ${page===1?'disabled':''}" data-p="${page-1}">‹</button>`;for(let i=1;i<=pages;i++)html+=`<button class="page-btn ${i===page?'active':''}" data-p="${i}">${i}</button>`;html+=`<button class="page-arrow ${page===pages?'disabled':''}" data-p="${page+1}">›</button>`;$('pager').innerHTML=html;$('pager').querySelectorAll('button').forEach(b=>b.onclick=()=>{let p=Number(b.dataset.p);if(p>=1&&p<=pages){page=p;renderTable();}});}
    function onAction(e){let id=e.currentTarget.dataset.id,act=e.currentTarget.dataset.action;if(act==='detail')openDetail(id);if(act==='pay')payOrder(id);if(act==='supplement')openSupplementGuide(id);if(act==='download')downloadDocs(id);if(act==='refundApply')applyRefund(id);if(act==='contact')contactAdvisor(id);if(act==='refund')openRefundDetail(id);}
    function order(id){return orders.find(x=>x.id===id)||orders[0];}
    function openDetail(id){let r=order(id);$('drawerTitle').textContent=`${r.user} / ${r.id}`;$('drawerSub').textContent=`${r.service} · ${r.stage} · ${r.court}`;$('drawerBody').innerHTML=detailHtml(r);$('drawer').classList.add('show');}
    function detailHtml(r){return block('订单信息',`<div class="detail-grid">${kv('订单编号',r.id)+kv('服务类型',r.service)+kv('用户',r.user)+kv('联系电话',r.phone)+kv('关联案件',r.caseNo)+kv('负责人员',r.owner)+kv('金额',`¥${r.amount}`)+kv('交付期限',r.deadline)}</div>`)+block('服务流程',stepsTpl(r))+block('案情摘要',esc(r.summary))+block('材料清单',listTags(r.materials,'暂无材料'))+block('交付文件',listTags(r.docs,'暂无交付文件'))+block('支付记录',timeline(r.payTrail))+block('操作轨迹',timeline(r.trail));}
    function block(t,b){return `<div class="section"><div class="section-head">${t}</div><div class="section-body">${b}</div></div>`;}
    function kv(k,v){return `<div class="kv"><div class="kv-label">${k}</div><div class="kv-value">${esc(v)}</div></div>`;}
    function stepsTpl(r){let flow=flowMap[r.service],idx=flow.indexOf(r.stage);return `<div class="steps">${flow.map((s,i)=>`<div class="step ${i<idx?'done':''} ${i===idx?'active':''}"><div class="dot">${i+1}</div><div>${s}</div></div>`).join('')}</div>`;}
    function listTags(arr,empty){return arr.length?arr.map(x=>`<span class="tag tag-gray" style="margin:0 8px 8px 0">${esc(x)}</span>`).join(''):empty;}
    function timeline(arr){return `<div class="timeline">${arr.map(x=>`<div class="time-item">${esc(x)}</div>`).join('')}</div>`;}
    function materialScore(r){let base=Math.min(100,45+r.materials.length*14);if(r.pay!=='已支付')base-=12;if(r.status==='待用户补充')base-=18;return Math.max(35,base);}
    function requiredMaterialRows(r){let required={文书服务包通:['身份/主体信息','诉讼请求与事实说明','证据材料','送达与联系方式'],线上立案服务:['身份信息','申请书/起诉书','证据清单','法院与被告信息'],线下律师代理开庭:['传票/开庭通知','授权委托材料','案件材料包','庭审诉求']};return (required[r.service]||[]).map((name,i)=>{let ok=r.materials.length>i&&!(r.status==='待用户补充'&&i===3);return `<tr><td>${esc(name)}</td><td><span class="tag ${ok?'tag-green':'tag-orange'}">${ok?'已核验':'待补充'}</span></td><td>${ok?'材料可识别，进入审核记录。':'需向用户发起补充或人工确认。'}</td></tr>`;}).join('');}
    function uploadedMaterialRows(r){return r.materials.length?r.materials.map((m,i)=>`<tr><td>${i+1}</td><td>${esc(m)}</td><td>${m.includes('.pdf')?'PDF':m.includes('.zip')?'压缩包':m.includes('.xlsx')?'表格':'文件'}</td><td><span class="tag tag-blue">已上传</span></td></tr>`).join(''):'<tr><td colspan="4" class="empty">暂无上传材料</td></tr>';}
    function riskRows(r){let risks=[];if(r.pay!=='已支付')risks.push(['支付状态',`当前为${r.pay}，建议确认后再进入正式交付。`]);if(r.materials.length<2)risks.push(['材料数量', '上传材料较少，可能无法支撑完整审核结论。']);if(r.status==='待用户补充')risks.push(['补充状态', '订单已处于待用户补充状态，需明确缺失项。']);if(r.service==='线上立案服务')risks.push(['立案信息', '需重点核验法院、被告身份信息和管辖依据。']);if(r.service==='线下律师代理开庭')risks.push(['开庭排期', '需核验开庭时间、授权手续和律师冲突排期。']);if(!risks.length)risks.push(['综合风险', '未发现明显材料阻断项，可进入下一节点。']);return risks.map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td></tr>`).join('');}
    function reviewSuggestion(r){if(r.status==='待用户补充')return '建议先选择“需用户补充”，在缺失项中写清需要补交的具体材料。';if(r.pay!=='已支付')return '建议先确认支付状态，再决定是否推进后续服务节点。';if(r.service==='文书服务包通')return '材料满足基础文书生成条件时，可审核通过并进入生成文书或律师审核节点。';if(r.service==='线上立案服务')return '重点确认法院、被告身份信息、案由和管辖依据，避免线上提交后被退回。';return '重点确认授权委托、开庭时间、案卷材料和律师排期，再推进到庭前准备。';}
    function auditSheet(r){let score=materialScore(r),generated=now();return `<div class="audit-sheet"><div class="audit-head"><div><h1 class="audit-title">${esc(r.service)}材料审核报告</h1><div class="audit-subtitle">订单编号：${esc(r.id)}<br/>关联案件：${esc(r.caseNo)}<br/>审核生成时间：${esc(generated)}</div></div><span class="audit-status">${esc(r.status)}</span></div><div class="audit-section"><h3>审核摘要</h3><div class="audit-summary"><div class="audit-card"><label>完整度</label><strong>${score} 分</strong></div><div class="audit-card"><label>上传材料</label><strong>${r.materials.length} 份</strong></div><div class="audit-card"><label>支付状态</label><strong>${esc(r.pay)}</strong></div><div class="audit-card"><label>当前阶段</label><strong>${esc(r.stage)}</strong></div></div></div><div class="audit-section"><h3>综合结论</h3><div class="audit-desc">${esc(r.summary)}</div></div><div class="audit-section"><h3>基础信息</h3><div class="audit-grid"><table class="audit-table"><tbody><tr><th>用户</th><td>${esc(r.user)}</td></tr><tr><th>联系电话</th><td>${esc(r.phone)}</td></tr><tr><th>负责人员</th><td>${esc(r.owner)}</td></tr></tbody></table><table class="audit-table"><tbody><tr><th>服务类型</th><td>${esc(r.service)}</td></tr><tr><th>法院/机构</th><td>${esc(r.court)}</td></tr><tr><th>交付期限</th><td>${esc(r.deadline)}</td></tr></tbody></table></div></div><div class="audit-section"><h3>上传材料清单</h3><table class="audit-table"><thead><tr><th style="width:64px">序号</th><th>材料名称</th><th style="width:96px">类型</th><th style="width:100px">状态</th></tr></thead><tbody>${uploadedMaterialRows(r)}</tbody></table></div><div class="audit-section"><h3>必备材料核验</h3><table class="audit-table"><thead><tr><th style="width:150px">核验项</th><th style="width:100px">状态</th><th>说明</th></tr></thead><tbody>${requiredMaterialRows(r)}</tbody></table></div><div class="audit-section"><h3>风险提示</h3><table class="audit-table"><thead><tr><th style="width:120px">项目</th><th>提示</th></tr></thead><tbody>${riskRows(r)}</tbody></table></div></div>`;}
    function openReview(id){let r=order(id);currentId=id;$('reviewBody').innerHTML=`<div class="review-workspace"><div class="review-report-pane">${auditSheet(r)}</div><aside class="review-side"><div class="review-side-title">审核处理</div><div class="review-side-sub">根据左侧预览报告确认材料是否完整，并记录本次审核结论。</div><div class="form-item"><label>审核结果</label><select class="select" id="reviewResult"><option>通过</option><option>需用户补充</option><option>驳回退款</option></select></div><div class="form-item"><label>缺失项</label><input class="input" id="reviewMissing" placeholder="例如：被告身份证号"></div><div class="form-item"><label>审核意见</label><textarea class="textarea" id="reviewNote">材料清晰，可进入下一流程。</textarea></div><div class="section" style="margin:14px 0 0"><div class="section-head">处理建议</div><div class="section-body">${reviewSuggestion(r)}</div></div></aside></div>`;show('reviewMask');}
    function saveReview(){let r=order(currentId),result=$('reviewResult').value,note=$('reviewNote').value;if(result==='通过'){r.stage=nextStage(r);r.status='处理中';r.trail.unshift(`${now()} 材料审核通过：${note}`);}else if(result==='需用户补充'){r.status='待用户补充';r.trail.unshift(`${now()} 材料需补充：${$('reviewMissing').value||note}`);}else{r.status='已退款';r.pay='已退款';r.trail.unshift(`${now()} 材料驳回，已进入退款处理`);}hide('reviewMask');renderAll();toast('材料审核已保存');}
    function openAdvance(id){let r=order(id),flow=flowMap[r.service],next=nextStage(r);currentId=id;$('advanceBody').innerHTML=`<div class="section"><div class="section-head">当前流程</div><div class="section-body">${r.id} · ${r.service} · ${r.stage}</div></div><div class="form-grid"><div class="form-item"><label>推进到阶段</label><select class="select" id="nextStage" style="width:100%">${flow.map(x=>`<option ${x===next?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-item"><label>负责人</label><select class="select" id="nextOwner" style="width:100%">${owners.map(x=>`<option ${x===r.owner?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-item full"><label>处理说明</label><textarea class="textarea" id="advanceNote">流程已处理，进入下一节点。</textarea></div></div>`;show('advanceMask');}
    function saveAdvance(){let r=order(currentId);r.stage=$('nextStage').value;r.owner=$('nextOwner').value;r.status=r.stage.includes('交付')||r.stage.includes('回执')||r.stage.includes('记录')?'待交付':'处理中';r.trail.unshift(`${now()} 推进到 ${r.stage}：${$('advanceNote').value}`);hide('advanceMask');renderAll();toast('订单流程已推进');}
    function markDelivered(id){let r=order(id);if(r.status==='已完成')return toast('订单已完成交付');r.status='已完成';r.stage=flowMap[r.service].at(-1);if(!r.docs.length)r.docs.push(`${r.service}交付文件.pdf`);r.trail.unshift(`${now()} 已交付：${r.docs[0]}`);renderAll();toast('订单已交付');}
    function payOrder(id){let r=order(id);if(r.pay==='已支付')return toast('该订单已完成支付');r.pay='已支付';if(r.status==='待处理')r.status='处理中';r.payTrail.unshift(`${now()} 用户发起支付确认`);r.trail.unshift(`${now()} 支付状态已更新为已支付`);renderAll();toast('支付已确认，服务将继续办理');}
    function openSupplementGuide(id){let r=order(id);openDetail(id);toast(`请按顾问要求补充 ${r.service} 相关材料`);}
    function downloadDocs(id){let r=order(id);if(!r.docs.length)return toast('暂无可下载交付文件');toast(`正在准备下载：${r.docs[0]}`);}
    function contactAdvisor(id){let r=order(id);toast(`已通知${r.owner}联系您`);}
    function applyRefund(id){let r=order(id);if(r.pay!=='已支付')return toast('当前订单尚未完成支付，无需申请退费');if(r.status==='已完成')return toast('已完成订单请联系客服处理退费');if(r.status==='退费审核中')return toast('退费申请已提交，请等待顾问审核');r.status='退费审核中';r.trail.unshift(`${now()} 用户提交退费申请，等待顾问审核`);r.payTrail.unshift(`${now()} 退费申请已提交`);renderAll();toast('退费申请已提交，顾问会尽快联系您');}
    function openRefundDetail(id){openDetail(id);toast('已打开退款处理记录');}
    function openCreate(){let service=activeTab==='全部'?services[0]:activeTab;$('createBody').innerHTML=`<div class="form-grid"><div class="form-item"><label>服务类型<span class="req">*</span></label><select class="select" id="newService" style="width:100%">${services.map(x=>`<option ${x===service?'selected':''}>${x}</option>`).join('')}</select></div><div class="form-item"><label>支付金额</label><input class="input" id="newAmount" value="899"></div><div class="form-item"><label>用户名称<span class="req">*</span></label><input class="input" id="newUser" placeholder="请输入用户名称"></div><div class="form-item"><label>手机号</label><input class="input" id="newPhone" placeholder="请输入手机号"></div><div class="form-item"><label>关联案件</label><input class="input" id="newCase" value="AJ${Date.now().toString().slice(-8)}"></div><div class="form-item"><label>负责人</label><select class="select" id="newOwner" style="width:100%">${owners.map(x=>`<option>${x}</option>`).join('')}</select></div><div class="form-item full"><label>订单摘要</label><textarea class="textarea" id="newSummary" placeholder="请输入订单服务诉求、案件背景或交付要求"></textarea></div></div>`;show('createMask');}
    function saveCreate(){let user=$('newUser').value.trim();if(!user)return toast('请填写用户名称');let service=$('newService').value,flow=flowMap[service];orders.unshift({id:`DD${Date.now().toString().slice(-11)}`,user,phone:$('newPhone').value||'待补充',caseNo:$('newCase').value,service,stage:flow[0],status:'待处理',pay:'待支付',amount:Number($('newAmount').value||0),owner:$('newOwner').value,createdAt:today(),deadline:tomorrow(),court:'待确认',summary:$('newSummary').value||'新建订单，待运营确认材料与服务范围。',materials:[],docs:[],trail:[`${now()} 新建订单`],payTrail:['待支付']});hide('createMask');page=1;renderAll();toast('订单已创建');}
    function nextStage(r){let flow=flowMap[r.service],idx=flow.indexOf(r.stage);return flow[Math.min(idx+1,flow.length-1)]||flow[0];}
    function bindEvents(){$('btnAdd').onclick=()=>toast('已为您打开服务咨询入口');$('btnExport').onclick=()=>toast('已通知客服与您联系');$('btnSaveCreate').onclick=saveCreate;$('btnSaveReview').onclick=saveReview;$('btnSaveAdvance').onclick=saveAdvance;$('btnSearch').onclick=()=>{page=1;renderAll();};$('btnReset').onclick=resetFilters;$('jumpInput').onkeydown=e=>{if(e.key==='Enter'){page=Math.max(1,Number(e.target.value||1));renderTable();}};document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));document.querySelector('[data-close-drawer]').onclick=()=>$('drawer').classList.remove('show');['keyword','serviceFilter','stageFilter','statusFilter','payFilter','ownerFilter','startDate','endDate'].forEach(id=>$(id).onchange=()=>{page=1;renderAll();});$('keyword').oninput=()=>{page=1;renderAll();};}
    function resetFilters(){['keyword','serviceFilter','stageFilter','statusFilter','payFilter','ownerFilter','startDate','endDate'].forEach(id=>$(id).value='');page=1;renderAll();}
    function today(){let d=new Date(),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`;}
    function now(){let d=new Date(),p=n=>String(n).padStart(2,'0');return `${today()} ${p(d.getHours())}:${p(d.getMinutes())}`;}
    function tomorrow(){let d=new Date(Date.now()+86400000),p=n=>String(n).padStart(2,'0');return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} 18:00`;}
    function show(id){$(id).classList.add('show')}function hide(id){$(id).classList.remove('show')}function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),2200)}
    init();
  </script>
</body>
</html>
